type: azure
title: AKS baseline
subtitle: Northwind orders · private cluster, WAF in front, egress through the hub firewall, no credentials in the cluster

# Left to right: Application Gateway (WAF, the only public IP; customers come in over HTTPS) → ingress → workload
# → what it uses. Above: the hub firewall, in sub-connectivity (drawn alone).
# vnet-orders-prod (10.2.0.0/16) is a spoke peered to the hub; snet-nodes sends 0.0.0.0/0 to the hub
# firewall (outboundType: userDefinedRouting), which allows FQDN rules and the AzureKubernetesService tag.
# aks-orders-prod: Azure CNI Overlay, private API server. Ingress is Traefik on an internal load balancer, as in
# the AKS baseline reference (mspnp/aks-baseline); ingress-nginx was retired upstream in March 2026.
# Workload identity: sa/orders-api is federated to id-orders-prod, which holds the role on Key Vault;
# secrets reach the pods through the CSI secrets store driver; image pulls use the kubelet identity.
# Adding a workload: a card in aks-orders-prod, a line from ingress, and its own managed identity.

groups:
  sub-orders-prod: { kind: subscription, label: sub-orders-prod, caption: Landing zone · Corp }
  vnet-orders-prod: { kind: vnet, label: vnet-orders-prod, caption: 10.2.0.0/16, in: sub-orders-prod }
  snet-appgw: { kind: subnet, label: snet-appgw, caption: 10.2.0.0/24, in: vnet-orders-prod }
  snet-nodes: { kind: subnet, label: snet-nodes, caption: 10.2.16.0/20, in: vnet-orders-prod }
  # The cluster group stands for its node pools (system and user), which run in snet-nodes
  aks-orders-prod: { kind: aks-cluster, label: aks-orders-prod, caption: Private cluster, in: snet-nodes }
  snet-pe: { kind: subnet, label: snet-pe, caption: 10.2.1.0/24, in: vnet-orders-prod }
  rg-orders-shared: { kind: resource-group, label: rg-orders-shared, in: sub-orders-prod }

nodes:
  agw-orders-prod: { kind: app-gateway, label: agw-orders-prod, caption: WAF v2 · public IP, in: snet-appgw, tags: [ingress] }
  traefik: { kind: load-balancer, label: traefik, caption: Internal LB, in: aks-orders-prod, tags: [ingress] }
  orders-api: { kind: container-app, label: orders-api, caption: 3 pods, in: aks-orders-prod, tags: [ingress, identity] }

  pep-cr-orders-prod: { kind: private-endpoint, label: pep-cr-orders-prod, in: snet-pe }
  pep-kv-orders-prod: { kind: private-endpoint, label: pep-kv-orders-prod, in: snet-pe, tags: [identity] }

  crordersprod: { kind: container-registry, label: crordersprod, caption: Premium · private, in: rg-orders-shared }
  kv-orders-prod: { kind: key-vault, label: kv-orders-prod, caption: RBAC · CSI driver, in: rg-orders-shared, tags: [identity] }
  id-orders-prod: { kind: managed-identity, label: id-orders-prod, caption: Workload identity, in: rg-orders-shared, tags: [identity] }

  afw-hub: { kind: firewall, label: afw-hub, caption: Premium · 10.0.0.68, tags: [egress] }

edges:
  - agw-orders-prod -> traefik: { style: private, tags: [ingress] }
  - traefik -> orders-api: { style: private, tags: [ingress] }
  - orders-api -> id-orders-prod: { style: identity, badge: true, tags: [identity] }
  - orders-api -> pep-kv-orders-prod: { label: secrets, style: private, tags: [identity] }
  - id-orders-prod -> kv-orders-prod: { label: Key Vault Secrets User, style: role, tags: [identity] }
  - pep-kv-orders-prod -> kv-orders-prod: { style: private, tags: [identity] }
  - aks-orders-prod -> pep-cr-orders-prod: { label: image pull, style: private }
  - pep-cr-orders-prod -> crordersprod: { style: private }
  - aks-orders-prod -> afw-hub: { label: egress · UDR, style: private, tags: [egress] }

layers:
  ingress:
    tags: [ingress]
    title: Ingress
    caption: One public entry, the WAF on Application Gateway; the ingress controller sits on an internal load balancer.
  egress:
    tags: [egress]
    title: Egress
    caption: Nothing leaves the cluster except through the hub firewall, which allows only the FQDNs AKS and the apps need.
  identity:
    tags: [identity]
    title: Identity
    caption: Pods sign in as id-orders-prod through workload identity; no credentials are stored in the cluster.

steps:
  - title: A private cluster
    caption: A private AKS cluster in its own spoke, with a subnet per role.
  - title: In from the internet
    caption: Customers reach the WAF's public IP over HTTPS; it forwards to the ingress controller on an internal load balancer.
    path: agw-orders-prod -> traefik -> orders-api
    note: { agw-orders-prod: "HTTPS from the internet: the only public entry" }
  - title: Secrets without passwords
    caption: The pod signs in as id-orders-prod through workload identity and reads Key Vault over a private endpoint.
    path: [orders-api -> pep-kv-orders-prod -> kv-orders-prod, id-orders-prod -> kv-orders-prod]
  - title: Images
    caption: Nodes pull images from the registry over a private endpoint; the registry has public access off.
    path: aks-orders-prod -> pep-cr-orders-prod -> crordersprod
  - title: Out
    caption: The node subnet's route table sends all egress to the hub firewall, which allows only what is needed.
    path: aks-orders-prod -> afw-hub
