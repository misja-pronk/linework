type: azure
title: Azure landing zone
subtitle: Northwind · management groups, subscriptions and the policy assigned at each level

# Boxes in boxes: a management group holds the groups and subscriptions under it, as in the portal.
# The groups and their policies are the Azure landing zone reference (ALZ); Online's WAF policy is Northwind's own.
# A management group's caption names the policy assigned there. Everything below inherits it,
# so a caption only says what is added at that level.
# Adding a workload: a subscription card in corp (private, peered to the hub) or online
# (internet-facing). Moving a subscription to decommissioned is how it is retired.

groups:
  tenant-root-group: { kind: tenant, label: Tenant root group, caption: northwind.onmicrosoft.com }
  northwind: { kind: management-group, label: Northwind, caption: Allowed regions · Defender for Cloud · diagnostics to Log Analytics, in: tenant-root-group }

  platform: { kind: management-group, label: Platform, caption: Run by the platform team, in: northwind }
  management: { kind: management-group, label: Management, caption: Inherited policy only, in: platform }
  connectivity: { kind: management-group, label: Connectivity, caption: DDoS protection on VNets, in: platform }
  identity: { kind: management-group, label: Identity, caption: No public IPs · VM backup, in: platform }

  landing-zones: { kind: management-group, label: Landing zones, caption: Subnets need an NSG · no RDP/SSH from the internet · TLS 1.2, in: northwind }
  corp: { kind: management-group, label: Corp, caption: No public IPs · PaaS only through private endpoints, in: landing-zones }
  online: { kind: management-group, label: Online, caption: Own policy · WAF in front of web apps, in: landing-zones }

  # Written last, Sandbox and Decommissioned stand on the right, one above the other
  sandbox: { kind: management-group, label: Sandbox, caption: No peering · no VPN or ExpressRoute, in: northwind }
  decommissioned: { kind: management-group, label: Decommissioned, caption: No new resources, in: northwind }

nodes:
  # Subscriptions: a card each, in the management group that governs it
  sub-management: { kind: subscription, label: sub-management, caption: Log Analytics · Automation, in: management }
  sub-connectivity: { kind: subscription, label: sub-connectivity, caption: Hub VNet · firewall · DNS, in: connectivity }
  sub-identity: { kind: subscription, label: sub-identity, caption: Domain controllers, in: identity }
  sub-erp-prod: { kind: subscription, label: sub-erp-prod, caption: Peered to the hub, in: corp }
  sub-intranet-prod: { kind: subscription, label: sub-intranet-prod, caption: Peered to the hub, in: corp }
  sub-shop-prod: { kind: subscription, label: sub-shop-prod, caption: Front Door · WAF, in: online }
  sub-sandbox-dev: { kind: subscription, label: sub-sandbox-dev, caption: Experiments, in: sandbox }
  sub-crm-old: { kind: subscription, tone: slate, icon: archive, label: sub-crm-old, caption: Retired 2026, in: decommissioned }

steps:
  - title: The hierarchy
    caption: Northwind's management groups, with a subscription per workload.
  - title: Policy is inherited
    caption: sub-erp-prod gets the policy of Northwind, Landing zones and Corp; each level below only adds to it.
    focus: sub-erp-prod
  - title: Platform
    caption: Shared services in their own subscriptions, run by the platform team.
    focus: platform
  - title: Landing zones
    caption: Corp workloads are private and peered to the hub; Online workloads face the internet behind a WAF.
    focus: landing-zones
  - title: Sandbox and decommissioned
    caption: Sandboxes cannot reach the corporate network; a retired subscription accepts no new resources.
    focus: [sandbox, decommissioned]
