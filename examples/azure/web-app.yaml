type: azure
title: Web application
subtitle: Northwind web shop · Front Door with WAF in front, no secrets in code, nothing else public

# Left to right: customers → edge (Front Door) → app (App Service, Container Apps) → data.
# Resource groups by lifecycle: the edge is global, app and data are regional (West Europe).
# Identity: one user-assigned managed identity (id-shop) used by the storefront and the API;
# it holds the roles on Key Vault and SQL, so there are no passwords or connection strings in config.
# Adding a service: a card in rg-shop-app, a line from whoever calls it, and an identity line from
# id-shop for each role it needs.

groups:
  sub: { kind: subscription, label: sub-webshop-prd, caption: Landing zone · Online }
  rg-edge: { kind: resource-group, label: rg-shop-edge, caption: Global, in: sub }
  rg-app: { kind: resource-group, label: rg-shop-app, caption: West Europe, in: sub }
  cae: { kind: boundary, label: cae-shop, caption: Container Apps · internal, in: rg-app }
  rg-data: { kind: resource-group, label: rg-shop-data, caption: West Europe, in: sub }

nodes:
  customers: { kind: users, label: Customers }

  afd: { kind: front-door, label: afd-shop, caption: Premium · WAF, in: rg-edge, tags: [security] }

  web: { kind: app-service, label: app-shop-web, caption: Storefront, in: rg-app }
  api: { kind: container-app, label: ca-shop-orders, caption: Orders API, in: cae }
  id: { kind: managed-identity, label: id-shop, caption: User-assigned, in: rg-app, tags: [security] }

  sql: { kind: sql-database, label: sqldb-shop, caption: Entra-only auth, in: rg-data }
  kv: { kind: key-vault, label: kv-shop-prd, caption: RBAC · public access off, in: rg-data, tags: [security] }
  st: { kind: storage, label: stshopmedia, caption: Product images, in: rg-data }

edges:
  - customers -> afd: { label: HTTPS, style: public, tags: [security] }
  - afd -> web: { label: Private Link, style: private, tags: [security] }
  - afd -> st: { label: /media, style: private }
  - web -> api: { label: REST, style: private }
  - api -> sql: { label: TDS, style: private }
  # The identity and the roles it holds
  - web -> id: { style: identity, badge: true, tags: [security] }
  - api -> id: { style: identity, badge: true, tags: [security] }
  - id -> kv: { label: Secrets User, style: role, tags: [security] }
  - id -> sql: { label: db_datawriter, style: role, tags: [security] }

layers:
  security:
    tags: [security]
    title: Security
    caption: One public entry, behind a WAF; the apps sign in to Key Vault and SQL with a managed identity.

steps:
  - The web shop in one subscription. Front Door is the only thing with a public address.
  - title: A customer opens the shop
    caption: Front Door terminates TLS, the WAF filters the request, and it reaches the storefront over Private Link.
    path: customers -> afd -> web
  - title: Placing an order
    caption: The storefront calls the Orders API inside an internal Container Apps environment; the API writes to SQL.
    path: web -> api -> sql
  - title: No secrets in code
    caption: Both apps run as id-shop. Its roles on Key Vault and SQL replace passwords and connection strings.
    path: [web -> id, api -> id, id -> kv, id -> sql]
