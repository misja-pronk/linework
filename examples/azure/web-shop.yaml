type: azure
title: Web shop
subtitle: Front Door is the only public entry; SQL and Key Vault are reached over private endpoints

# The small version of azure/web-app.yaml, told the same way: no passwords or connection-string
# secrets in config. The API runs with a managed identity; SQL allows Entra authentication only,
# and Key Vault holds only what has no Entra sign-in (here the payment provider's API key).
# Each subnet does one job: App Service VNet integration and a Container Apps environment each need
# a subnet delegated to them alone, and private endpoints get a subnet of their own. VNet integration
# carries only the web app's outbound traffic, so the web app is not drawn inside snet-web: its
# caption names the subnet its calls leave from. Inbound, Front Door Premium reaches the app over
# Private Link, through a private endpoint Front Door manages itself (not one in this VNet), and the
# app takes no public traffic. snet-cae holds the Container Apps environment. Front Door is global
# but, like any resource, sits in a resource group.
# SQL and Key Vault are PaaS: they sit in the resource group, not in a subnet, with public network
# access off; the private endpoints in snet-pe are their only way in.

groups:
  prod: { kind: subscription, label: sub-shop-prd }
  rg: { kind: resource-group, label: rg-shop-prd, caption: West Europe, in: prod }
  vnet: { kind: vnet, label: vnet-shop, caption: 10.20.0.0/22, in: rg }
  cae-snet: { kind: subnet, label: snet-cae, caption: Apps env, in: vnet }
  pe-snet: { kind: subnet, label: snet-pe, caption: Private endpoints, in: vnet }

nodes:
  users: users
  edge: { kind: front-door, label: Front Door, caption: Premium · WAF, in: rg, tags: [security, ops] }
  web: { kind: app-service, label: Web shop, caption: Out via snet-web, in: rg, tags: [ops] }
  api: { kind: container-app, label: Orders API, caption: Managed identity, in: cae-snet, tags: [ops, security] }
  pe-sql: { kind: private-endpoint, label: pe-sql-shop, in: pe-snet, tags: [data] }
  pe-kv: { kind: private-endpoint, label: pe-kv-shop, in: pe-snet, tags: [security] }
  db: { kind: sql-database, label: Orders, caption: Entra-only auth, in: rg, tags: [data] }
  vault: { kind: key-vault, label: Secrets, caption: RBAC · private, in: rg, tags: [security] }

edges:
  - users -> edge: { label: HTTPS, style: public, tags: [security] }
  - edge -> web: { label: Private Link, style: private, tags: [security] }
  - web -> api: { label: REST, style: private }
  - api -> pe-sql: { style: private, tags: [data] }
  - pe-sql -> db: { label: TDS, style: private, tags: [data] }
  - api -> pe-kv: { style: private, tags: [security] }
  - pe-kv -> vault: { label: secrets, style: private, tags: [security] }

# One drawing, three ways to look at it: the Layers control in the editor (L), or
# linework render web-shop.yaml --layer security (--all-layers -o out/ for one picture each)
layers:
  security:
    tags: [security]
    title: Security
    caption: Only the front door is public; the API signs in to SQL and Key Vault with its own identity.
  data:
    tags: [data]
    title: Data
    caption: Orders live in SQL, reached only by the API through its private endpoint.
  ops:
    tags: [ops]
    title: Operations
    dim-others: true
    caption: What takes the traffic and runs our code, from the front door to the Orders API.

# Told in steps: Present in the editor, or linework render web-shop.yaml --all-steps
steps:
  - The web shop in production. One subscription, and nothing is public except the front door.
  - users -> edge -> web: A customer opens the shop. Front Door terminates TLS and reaches the web app over Private Link.
  - web -> api: Placing an order is a private REST call inside the virtual network.
  - title: Orders are stored
    caption: The Orders API reaches SQL through its private endpoint in snet-pe.
    path: api -> pe-sql -> db
    note: { db: Public access off }
  - title: No secrets in code
    caption: The API signs in to SQL and Key Vault with its managed identity; Key Vault keeps only the payment provider's key.
    path: [api -> pe-sql -> db, api -> pe-kv -> vault]
