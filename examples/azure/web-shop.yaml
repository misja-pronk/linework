type: azure
title: Web shop
subtitle: Production

groups:
  prod: { kind: subscription, label: Production }
  rg: { kind: resource-group, label: rg-shop-prod, in: prod }
  vnet: { kind: vnet, label: vnet-shop, in: rg }
  apps: { kind: subnet, label: snet-apps, in: vnet }
  data: { kind: subnet, label: snet-data, in: vnet }

nodes:
  users: users
  edge: { kind: front-door, label: Front Door, tags: [security, ops] }
  web: { kind: app-service, label: Web shop, in: apps, tags: [ops] }
  api: { kind: container-app, label: Orders API, in: apps, tags: [ops] }
  db: { kind: sql-database, label: Orders, in: data, tags: [data] }
  vault: { kind: key-vault, label: Secrets, in: rg, tags: [security] }

badges: [identity]

edges:
  - users -> edge: { label: HTTPS, style: public, tags: [security] }
  - edge -> web: { style: public }
  - web -> api: { label: REST, style: private }
  - api -> db: { label: SQL, style: private, tags: [data] }
  - api -> vault: { label: secrets, style: identity, tags: [security] }

# One drawing, three ways to look at it: the Layers control in the editor (L), or
# carto render web-shop.yaml --layer security (--all-layers -o out/ for one picture each)
layers:
  security:
    tags: [security]
    title: Security
    caption: Only the front door is public; the API reads its secrets with its own identity.
  data:
    tags: [data]
    title: Data
    caption: Orders live in SQL on the data subnet, reached only by the API.
  ops:
    tags: [ops]
    title: Operations
    dim-others: true
    caption: What takes the traffic and runs our code, from the front door to the Orders API.

# Told in steps: Present in the editor, or carto render web-shop.yaml --all-steps
steps:
  - The web shop in production. One subscription, and nothing is public except the front door.
  - users -> edge -> web: A customer opens the shop. Front Door terminates TLS and forwards to the web app.
  - web -> api: Placing an order is a private REST call inside the virtual network.
  - title: Orders are stored
    caption: The Orders API writes to SQL over the data subnet.
    path: api -> db
    note: { db: No public endpoint }
  - title: No secrets in code
    caption: The API reads its connection string from Key Vault with its managed identity.
    path: api -> vault
