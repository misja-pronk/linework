type: azure
title: Data platform
subtitle: Northwind · from sources to reports through a bronze, silver and gold lake, all on private networking
direction: right

# Left to right: sources → ingestion → lake (bronze) → Databricks → lake (silver, gold) → serving.
# Processing is Azure Databricks with Unity Catalog: the most common choice for a lakehouse on
# Azure today. Microsoft Fabric would replace Databricks and the SQL warehouse with one workspace.
# Private networking: the storage account and Key Vault have public access off and private
# endpoints, Databricks is VNet-injected without public IPs, Data Factory runs in a managed VNet.
# Captions stay short so the drawing reads on a slide: ERP is on-premises SQL Server (through a
# self-hosted integration runtime), CRM a SaaS REST API; bronze holds data as delivered, silver
# cleaned and conformed, gold business-ready Delta tables. Power BI is SaaS, outside Azure: it is
# drawn in the subscription only to stand beside the warehouse it queries (DirectQuery).
# Adding a source: a card in sources and a line to Data Factory (batch) or Event Hubs (streaming).

groups:
  sources: { kind: boundary, label: Sources }
  sub: { kind: subscription, label: sub-data-prd, caption: Landing zone · Corp }
  rg-process: { kind: resource-group, label: rg-data-process, in: sub }
  rg-ingest: { kind: resource-group, label: rg-data-ingest, in: sub }
  rg-lake: { kind: resource-group, label: rg-data-lake, in: sub }
  lake: { kind: boundary, label: stnwlakeprd, caption: ADLS Gen2, in: rg-lake }
  rg-serve: { kind: resource-group, label: rg-data-serve, in: sub }

nodes:
  erp: { kind: external, label: ERP, caption: SQL Server · nightly, in: sources }
  crm: { kind: external, label: CRM, caption: REST API · hourly, in: sources }
  web: { kind: app-service, label: Web shop, caption: Clickstream events, in: sources }

  adf: { kind: data-factory, label: adf-nw-data, caption: Managed VNet, in: rg-ingest }
  evh: { kind: event-hub, label: evh-clickstream, in: rg-ingest }

  bronze: { kind: storage, label: bronze, caption: Raw, in: lake }
  silver: { kind: storage, label: silver, caption: Cleaned, in: lake }
  gold: { kind: storage, label: gold, caption: Business-ready, in: lake }

  dbw: { kind: databricks, label: dbw-nw-data, caption: Unity Catalog · VNet-injected, in: rg-process }

  sqlwh: { kind: sql-warehouse, label: Serverless SQL warehouse, caption: Databricks SQL, in: rg-serve }
  bi: { kind: users, label: Power BI, caption: Reports · DirectQuery, in: sub }

edges:
  - erp -> adf: { style: data }
  - crm -> adf: { style: data }
  - web -> evh: { style: data }
  - adf -> bronze: { style: data }
  - evh -> bronze: { style: data }
  # Databricks jobs move the data up the medallion; the workspace governs the lake through Unity Catalog
  - bronze -> silver: { label: clean, style: data }
  - silver -> gold: { label: model, style: data }
  - dbw ..> lake: { label: jobs, style: management }
  - gold -> sqlwh: { style: data }
  - sqlwh -> bi: { style: data }

steps:
  - One subscription with a resource group per stage, and the lake in the middle.
  - title: Ingest
    caption: Data Factory copies batch sources into bronze; web shop events stream in through Event Hubs.
    path: [erp -> adf -> bronze, crm -> adf, web -> evh -> bronze]
  - title: Refine
    caption: Databricks jobs clean bronze into silver and model silver into gold, governed by Unity Catalog.
    path: [dbw -> lake, bronze -> silver -> gold]
  - title: Serve
    caption: Analysts query gold through a serverless SQL warehouse from Power BI.
    path: gold -> sqlwh -> bi
