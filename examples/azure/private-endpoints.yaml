type: azure
title: Private endpoints and DNS
subtitle: Northwind · every PaaS service behind a private endpoint of its own, resolved the same way from Azure and from the office

# Left to right: head office → hub (DNS Private Resolver, private DNS zones) → spoke (app, private endpoints) → PaaS.
# The PaaS services have public network access off: the only way in is the private endpoint.
# Spoke VNets use the resolver's inbound IP (10.0.1.4) as DNS server. The office DNS has conditional forwarders
# for the public zones (database.windows.net, blob.core.windows.net) to that IP; the privatelink zones live once, linked to the hub VNet.
# The other way: the forwarding ruleset, linked to the VNets, sends northwind.local through the resolver's
# outbound endpoint (snet-dns-out) to the office DNS.
# Adding a service (Key Vault: zone privatelink.vaultcore.azure.net, pep-kv-claims-prod 10.1.9.6): a card in
# rg-claims-data, an endpoint in snet-pe, a zone in rg-dns-privatelink, and the lines app → endpoint → service.

groups:
  head-office: { kind: on-premises, label: Head office, caption: 10.10.0.0/16 }

  sub-connectivity: { kind: subscription, label: sub-connectivity, caption: Platform · Connectivity }
  vnet-hub-weu: { kind: vnet, label: vnet-hub-weu, caption: 10.0.0.0/22, in: sub-connectivity }
  snet-dns-in: { kind: subnet, label: snet-dns-in, caption: 10.0.1.0/28, in: vnet-hub-weu }
  snet-dns-out: { kind: subnet, label: snet-dns-out, caption: 10.0.1.16/28, in: vnet-hub-weu }
  rg-dns-privatelink: { kind: resource-group, label: rg-dns-privatelink, caption: Zones linked to the hub, in: sub-connectivity }

  sub-claims-prod: { kind: subscription, label: sub-claims-prod, caption: Landing zone · Corp }
  vnet-claims-prod: { kind: vnet, label: vnet-claims-prod, caption: 10.1.8.0/22, in: sub-claims-prod }
  snet-app: { kind: subnet, label: snet-app, caption: 10.1.8.0/24, in: vnet-claims-prod }
  snet-pe: { kind: subnet, label: snet-pe, caption: 10.1.9.0/24, in: vnet-claims-prod }
  rg-claims-data: { kind: resource-group, label: rg-claims-data, caption: Public access off, in: sub-claims-prod }

nodes:
  dc01: { kind: dns, icon: server, label: dc01.northwind.local, caption: Conditional forwarders, in: head-office, tags: [dns] }

  dnspr-hub: { kind: dns, label: dnspr-hub, caption: Inbound endpoint · 10.0.1.4, in: snet-dns-in, tags: [dns] }
  # The resolver's outbound endpoint; its ruleset dnsfrs-hub (a resource of its own, linked to the VNets) holds the rule
  outbound-endpoint: { kind: dns, label: Outbound endpoint, caption: Ruleset · northwind.local → 10.10.0.10, in: snet-dns-out, tags: [dns] }
  privatelink-database: { kind: dns, label: privatelink.database.windows.net, caption: Private DNS zone, in: rg-dns-privatelink, tags: [dns] }
  privatelink-blob: { kind: dns, label: privatelink.blob.core.windows.net, caption: Private DNS zone, in: rg-dns-privatelink, tags: [dns] }

  vmss-claims-prod: { kind: vmss, label: vmss-claims-prod, caption: Claims API, in: snet-app }
  pep-sql-claims-prod: { kind: private-endpoint, label: pep-sql-claims-prod, caption: 10.1.9.4, in: snet-pe }
  pep-st-claims-prod: { kind: private-endpoint, label: pep-st-claims-prod, caption: 10.1.9.5, in: snet-pe }

  sql-claims-prod: { kind: sql-database, label: sql-claims-prod, caption: Database sqldb-claims-prod, in: rg-claims-data }
  stclaimsprod: { kind: storage, label: stclaimsprod, caption: Storage account, in: rg-claims-data }

# DNS lookups are dotted lines without a style: the key names them.
key:
  dotted: DNS query

edges:
  # How a name is found
  - dc01 ..> dnspr-hub: { tags: [dns] }
  - vmss-claims-prod ..> dnspr-hub: { tags: [dns] }
  - dnspr-hub ..> privatelink-database: { tags: [dns] }
  - dnspr-hub ..> privatelink-blob: { tags: [dns] }
  # Names the other way: the ruleset sends northwind.local through the outbound endpoint to the office DNS
  - dnspr-hub ..> outbound-endpoint: { tags: [dns] }
  # How the traffic flows
  - vmss-claims-prod -> pep-sql-claims-prod: { style: private }
  - vmss-claims-prod -> pep-st-claims-prod: { style: private }
  - pep-sql-claims-prod -> sql-claims-prod: { label: TDS 1433, style: private }
  - pep-st-claims-prod -> stclaimsprod: { label: HTTPS 443, style: private }

layers:
  dns:
    tags: [dns]
    title: Name resolution
    caption: One resolver, one set of privatelink zones, used by the spokes and the office alike.

steps:
  - title: Two services, one pattern
    caption: SQL and Storage are each reachable only through a private endpoint in the spoke.
  - title: The app asks for a name
    caption: The SQL name is a CNAME to its privatelink name; the resolver answers 10.1.9.4 from the private zone.
    path: vmss-claims-prod -> dnspr-hub -> privatelink-database
  - title: And connects privately
    caption: The connection goes to the endpoint's private IP in snet-pe, never over the internet.
    path: vmss-claims-prod -> pep-sql-claims-prod -> sql-claims-prod
  - title: From the office
    caption: Office DNS forwards database.windows.net and blob.core.windows.net to 10.0.1.4, so it gets the same private IPs.
    path: dc01 -> dnspr-hub
    note: { dc01: "database.windows.net → 10.0.1.4" }
  - title: Every service the same way
    caption: Key Vault, Service Bus… each gets an endpoint in snet-pe and a zone, linked to the hub once.
    focus: [snet-pe, rg-dns-privatelink, rg-claims-data]
    note: { pep-sql-claims-prod: "Next: pep-kv-claims-prod · 10.1.9.6", privatelink-database: "Next: privatelink.vaultcore.azure.net" }
