type: data-products
title: Web shop data mesh
subtitle: Six data products over three domains; their ODCS contracts are in the detailed views

domains:
  customer: { label: Customer }
  sales: { label: Sales }
  finance: { label: Finance }

sources:
  crm-accounts: { label: CRM accounts, caption: Outside the mesh }
  webshop-order-events: { label: Webshop order events, caption: Outside the mesh }
  payment-provider-settlements: { label: Payment provider settlements, caption: Outside the mesh }

products:
  customer-360:
    label: Customer 360
    class: aggregate # it joins two domains
    domain: customer
    owner: CRM team
    version: 0.9.0
    status: draft
    inputs: [orders.orders, customers]
    outputs:
      profiles: { kind: table, contract: customer-profiles }
  customers:
    label: Customers
    class: source-aligned
    domain: customer
    owner: CRM team
    version: 1.4.0
    inputs: [crm-accounts]
    outputs:
      customers: { kind: table, contract: customers }
  exchange-rates:
    label: Exchange rates
    class: source-aligned
    owner: Treasury
    version: "1.0"
    outputs:
      rates-api: { kind: api, label: Rates API }
  orders:
    label: Orders
    class: source-aligned
    domain: sales
    owner: Sales engineering
    version: 2.1.0
    inputs: [webshop-order-events]
    outputs:
      orders: { kind: table, contract: orders }
      order-placed: { kind: topic, label: order placed }
  payments:
    label: Payments
    class: source-aligned
    domain: finance
    owner: Finance data
    version: 3.2.0
    inputs: [payment-provider-settlements]
    outputs:
      settled-payments: { kind: table, label: settled payments, contract: settled-payments }
  revenue:
    label: Revenue
    class: consumer-aligned
    domain: finance
    owner: Finance data
    version: 1.2.0
    inputs: [payments, exchange-rates, orders.orders]
    outputs:
      revenue-by-day: { kind: api, label: revenue by day }

consumers:
  cfo: { kind: dashboard, label: CFO dashboard, uses: [revenue] }
  campaigns: { kind: application, label: Campaign tool, uses: [customer-360] }

contracts:
  customer-profiles: { file: mesh/contracts/customer-profiles.odcs.yaml }
  customers: { file: mesh/contracts/customers.odcs.yaml }
  orders: { file: mesh/contracts/orders.odcs.yaml }
  settled-payments: { file: mesh/contracts/payments.odcs.yaml }

views:
  revenue-lineage:
    title: Where revenue comes from
    focus: { on: revenue, hops: all, direction: upstream }
  orders-impact:
    title: What a change to Orders touches
    focus: { on: orders, hops: all, direction: downstream }
