{{- $fullname := include "shop.fullname" . }}
{{- range $name, $worker := .Values.workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker-{{ $name }}
spec:
  selector:
    matchLabels:
      {{- include "shop.selector" (dict "name" (printf "worker-%s" $name) "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.selector" (dict "name" (printf "worker-%s" $name) "root" $) | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: {{ include "shop.image" (dict "name" "worker" "root" $) }}
          args: ["worker", "--queues", {{ join "," $worker.queues | quote }}]
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
{{- end }}
