{{- if .Values.payments.enabled }}
{{- $fullname := include "shop.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-payments
spec:
  replicas: {{ .Values.payments.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selector" (dict "name" "payments" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.selector" (dict "name" "payments" "root" $) | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}
      containers:
        - name: payments
          image: {{ include "shop.image" (dict "name" "payments" "root" $) }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-stripe
            - configMapRef:
                name: {{ $fullname }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-payments
spec:
  selector:
    {{- include "shop.selector" (dict "name" "payments" "root" $) | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.payments.port }}
{{- end }}
