{{- $fullname := include "shop.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shop.selector" (dict "name" "api" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.selector" (dict "name" "api" "root" $) | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}
      containers:
        - name: api
          image: {{ include "shop.image" (dict "name" "orders" "root" $) }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
spec:
  selector:
    {{- include "shop.selector" (dict "name" "api" "root" $) | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-api
  minReplicas: {{ .Values.api.autoscaling.min }}
  maxReplicas: {{ .Values.api.autoscaling.max }}
{{- end }}
