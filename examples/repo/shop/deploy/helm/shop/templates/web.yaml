{{- $fullname := include "shop.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selector" (dict "name" "web" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.selector" (dict "name" "web" "root" $) | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}
      containers:
        - name: web
          image: {{ include "shop.image" (dict "name" "web" "root" $) }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: ORDERS_URL
              value: {{ printf "http://%s-api" $fullname | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
spec:
  selector:
    {{- include "shop.selector" (dict "name" "web" "root" $) | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
