name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  infra:
    name: Azure infrastructure
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: azure/login@v2
      - run: az deployment group create -g rg-shop-staging -f infra/main.bicep

  staging:
    name: Deploy to staging
    needs: [build, infra]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.shop.example.com
    steps:
      - run: helm upgrade --install shop deploy/helm/shop -n shop

  smoke:
    name: Smoke tests
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - run: npx playwright test e2e/smoke

  production:
    name: Deploy to production
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shop.example.com
    steps:
      - run: helm upgrade --install shop deploy/helm/shop -n shop -f deploy/helm/shop/values-prod.yaml

  announce:
    name: Announce release
    needs: production
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v1
