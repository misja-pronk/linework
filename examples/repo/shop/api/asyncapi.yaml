asyncapi: 3.0.0
info:
  title: Orders service
  version: 2.14.0
  description: What the orders service sends and what it listens to.
servers:
  kafka:
    host: kafka.shop.internal:9092
    protocol: kafka
  rabbit:
    host: rabbitmq.shop.internal:5672
    protocol: amqp
channels:
  orderEvents:
    address: shop.orders.v1
    servers: [{ $ref: '#/servers/kafka' }]
    messages:
      orderPlaced: { $ref: '#/components/messages/OrderPlaced' }
      orderCancelled: { $ref: '#/components/messages/OrderCancelled' }
  paymentResults:
    address: payments.results
    servers: [{ $ref: '#/servers/rabbit' }]
    bindings: { amqp: { is: queue, queue: { name: orders.payment-results, durable: true } } }
    messages:
      paymentSucceeded: { $ref: '#/components/messages/PaymentSucceeded' }
      paymentFailed: { $ref: '#/components/messages/PaymentFailed' }
  emails:
    address: emails
    servers: [{ $ref: '#/servers/rabbit' }]
    bindings: { amqp: { is: queue } }
    messages:
      sendEmail: { $ref: '#/components/messages/SendEmail' }
operations:
  publishOrderPlaced:
    action: send
    channel: { $ref: '#/channels/orderEvents' }
    messages:
      - $ref: '#/channels/orderEvents/messages/orderPlaced'
      - $ref: '#/channels/orderEvents/messages/orderCancelled'
  onPaymentResult:
    action: receive
    channel: { $ref: '#/channels/paymentResults' }
  requestEmail:
    action: send
    channel: { $ref: '#/channels/emails' }
components:
  messages:
    OrderPlaced: { name: OrderPlaced, payload: { type: object } }
    OrderCancelled: { name: OrderCancelled, payload: { type: object } }
    PaymentSucceeded: { name: PaymentSucceeded, payload: { type: object } }
    PaymentFailed: { name: PaymentFailed, payload: { type: object } }
    SendEmail: { name: SendEmail, payload: { type: object } }
