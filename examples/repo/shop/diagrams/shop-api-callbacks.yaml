type: sequence
title: "Pay for an order, with its callback"

participants:
  client: { kind: service, label: API client }
  api: { kind: service, label: Shop API }

messages:
  - client -> api: POST /payments
  - api --> client: "202"
  - api -> client: POST callback (paymentResult)
  - note: The payment succeeded or failed
    over: client
  - client --> api: "200"
