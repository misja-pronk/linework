type: kubernetes
title: shop chart 0.7.2

groups:
  cluster: { kind: cluster, label: Cluster, tags: [imported] }
  ns-default: { kind: namespace, label: default, in: cluster, tags: [imported] }

nodes:
  internet: { kind: internet, tags: [imported] }
  shop-ing: { kind: ingress, label: shop, in: ns-default, host: shop.example.com, tags: [imported] }
  shop-api-svc: { kind: service, label: shop-api, in: ns-default, ports: [80:8000], tags: [imported] }
  shop-payments-svc: { kind: service, label: shop-payments, in: ns-default, ports: [80:8000], tags: [imported] }
  shop-web-svc: { kind: service, label: shop-web, in: ns-default, ports: [80:3000], tags: [imported] }
  shop-api: { kind: deployment, in: ns-default, replicas: 2, image: ghcr.io/acme/orders:2.14.0, tags: [imported] }
  shop-payments: { kind: deployment, in: ns-default, image: ghcr.io/acme/payments:2.14.0, tags: [imported] }
  shop-web: { kind: deployment, in: ns-default, replicas: 2, image: ghcr.io/acme/web:2.14.0, tags: [imported] }
  shop-worker-emails: { kind: deployment, in: ns-default, image: ghcr.io/acme/worker:2.14.0, tags: [imported] }
  shop-worker-orders: { kind: deployment, in: ns-default, image: ghcr.io/acme/worker:2.14.0, tags: [imported] }
  shop-config: { kind: configmap, in: ns-default, tags: [imported] }
  shop-db: { kind: secret, in: ns-default, tags: [imported] }
  shop: { kind: serviceaccount, in: ns-default, tags: [imported] }
  shop-stripe: { kind: secret, in: ns-default, tags: [imported] }
  shop-tls: { kind: secret, in: ns-default, tags: [imported] }

edges:
  - internet -> shop-ing: HTTPS
  - shop-ing -> shop-tls
  - shop-ing -> shop-web-svc: /
  - shop-ing -> shop-api-svc: /api
  - shop-api-svc -> shop-api
  - shop-payments-svc -> shop-payments
  - shop-web-svc -> shop-web
  - shop-api -> shop-config
  - shop-api -> shop-db
  - shop-api -> shop
  - shop-payments -> shop-stripe
  - shop-payments -> shop-config
  - shop-payments -> shop
  - shop-web -> shop
  - shop-worker-emails -> shop-config
  - shop-worker-orders -> shop-config
