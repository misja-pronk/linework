type: kubernetes
title: Shop on Kubernetes

groups:
  cluster: { kind: cluster, label: Cluster, tags: [imported] }
  ns-data: { kind: namespace, label: data, in: cluster, tags: [imported] }

nodes:
  shop-postgres-svc: { kind: service, label: shop-postgres, in: ns-data, ports: [5432], tags: [imported] }
  shop-postgres: { kind: statefulset, in: ns-data, image: postgres:16.4, ports: [5432], tags: [imported] }
  shop-backup: { kind: cronjob, in: ns-data, image: ghcr.io/acme/pg-backup:1.2, schedule: 0 3 * * *, tags: [imported] }
  data: { kind: pvc, in: ns-data, size: 50Gi, tags: [imported] }
  shop-db: { kind: secret, in: ns-data, tags: [imported] }

edges:
  - shop-postgres-svc -> shop-postgres
  - shop-postgres -> data
  - shop-postgres -> shop-db
  - shop-backup -> shop-db
