# Northwind's lakehouse on Azure Databricks, described once (West Europe). Diagrams in this folder include it.
#   teams         who owns what (owner: on the rest; on a catalog, its Unity Catalog owner: the domain team in dev,
#                 sp-lakehouse-test and sp-lakehouse-prod in test and prod, see governance.yaml)
#   sources       ERP (on-premises), web shop (Azure SQL, Event Hubs), Salesforce
#   lakehouse     what the bundle deploys to every workspace: Lakeflow Connect, pipelines, jobs, warehouse, serving, app
#   uc            the Unity Catalog metastore: <domain>_<env> catalogs (bronze, silver, gold schemas),
#                 cred_<domain>_<env> storage credentials, <domain>_<env>_catalog and _landing external locations,
#                 shares and recipients
#   per env       sub-, rg-, vnet- (host, container, pep subnets), nsg-, rt- (0.0.0.0/0 to afw-hub), dbw-, dbac-,
#                 kv-, ncc-, pep- (back-end, front-end), st<domain><env> (containers: catalog, landing) with pep-…-dfs
#   hub           vnet-hub-weu with afw-hub, the front-end and browser-auth endpoints, dbw-webauth-weu, DNS zones
#   consumers     Power BI, analysts, sales reps, replenishment, Contoso Retail (OpenSharing)
# One classic, VNet-injected workspace per environment, shared by the domains (catalogs and groups keep them apart,
# as Databricks advises); dbw-webauth-weu only serves browser sign-in over Private Link. Each <domain>_<env> catalog
# is ISOLATED and bound to dbw-lakehouse-<env> only. Storage is per domain and environment; no shared lake account.
# Data-flow relations describe production; storage, binding and network relations are given for every environment.
type: model
title: Northwind lakehouse

elements:
  # Teams
  platform-team: { kind: users, label: Data platform team, description: Runs the workspaces and Unity Catalog, tags: [team] }
  orders-team: { kind: users, label: Order management team, tags: [team] }
  webshop-team: { kind: users, label: Web shop team, tags: [team] }
  finance-team: { kind: users, label: Finance data team, tags: [team] }
  sales-team: { kind: users, label: Sales analytics team, tags: [team] }
  customers-team: { kind: users, label: CRM team, tags: [team] }
  supply-team: { kind: users, label: Supply chain data team, tags: [team] }
  analysts: { kind: users, label: Business analysts, description: Read gold data in Power BI and Genie }
  sales-reps: { kind: users, label: Sales reps, description: Look up customers in the Customer 360 app }

  # Identity
  entra-id: { kind: identity, label: Entra ID, technology: northwind.onmicrosoft.com, description: Users and groups; synced to the Databricks account by automatic identity management }
  databricks-account: { kind: control-plane, label: Databricks account, technology: Account console, description: Holds account groups and workspaces and the metastore, owner: platform-team }

  # Sources
  erp: { kind: external, label: ERP, technology: SQL Server · on-premises, description: Orders and invoices and stock, tags: [source] }
  sqldb-webshop-prod: { kind: database, label: sqldb-webshop-prod, technology: Azure SQL Database, description: Web shop orders and accounts, owner: webshop-team, tags: [source, prod] }
  evhns-webshop-prod: { kind: topic, label: evhns-webshop-prod, technology: Event Hubs · clickstream, description: Clickstream events of the web shop, owner: webshop-team, tags: [source, prod] }
  salesforce: { kind: external, label: Salesforce, technology: Sales Cloud, description: Accounts and opportunities, tags: [source, external] }

  # What the bundle deploys (Declarative Automation Bundles), the same in every workspace
  lakehouse:
    kind: databricks
    label: Northwind lakehouse
    description: Pipelines, jobs and serving, deployed from Git to dev, test and prod
    owner: platform-team
    elements:
      erp-ingest: { kind: lakeflow-connect, label: erp-ingest, technology: SQL Server connector · ingestion gateway, owner: orders-team }
      webshop-ingest: { kind: lakeflow-connect, label: webshop-ingest, technology: SQL Server connector, owner: webshop-team }
      salesforce-ingest: { kind: lakeflow-connect, label: salesforce-ingest, technology: Salesforce connector, owner: customers-team }
      clickstream: { kind: lakeflow-pipeline, label: clickstream, technology: Streaming · Kafka API, owner: webshop-team }
      orders-pipeline: { kind: lakeflow-pipeline, label: orders-pipeline, owner: orders-team }
      webshop-pipeline: { kind: lakeflow-pipeline, label: webshop-pipeline, owner: webshop-team }
      finance-pipeline: { kind: lakeflow-pipeline, label: finance-pipeline, owner: finance-team }
      sales-pipeline: { kind: lakeflow-pipeline, label: sales-pipeline, owner: sales-team }
      customers-pipeline: { kind: lakeflow-pipeline, label: customers-pipeline, owner: customers-team }
      supply-pipeline: { kind: lakeflow-pipeline, label: supply-pipeline, technology: Auto Loader, owner: supply-team }
      nightly: { kind: lakeflow-job, label: nightly, technology: 02:00 · serverless, description: Runs the domain pipelines in order }
      forecast-training: { kind: lakeflow-job, label: forecast-training, technology: Weekly · MLflow, owner: supply-team }
      bi-warehouse: { kind: sql-warehouse, label: bi-warehouse, technology: Serverless SQL warehouse }
      demand-forecast: { kind: model-serving, label: demand-forecast, technology: Serving endpoint, owner: supply-team }
      customer-360: { kind: databricks-app, label: customer-360, technology: Databricks App, owner: sales-team }

  # Unity Catalog: one metastore for the region, every environment in it
  uc-weu:
    kind: metastore
    label: uc-weu
    technology: Unity Catalog · West Europe
    description: No metastore storage; every catalog has its own managed location
    owner: platform-team
    elements:
      system: { kind: catalog, label: system, description: System tables for billing and audit and lineage }
      orders_dev: { kind: catalog, label: orders_dev, owner: orders-team, tags: [dev], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      webshop_dev: { kind: catalog, label: webshop_dev, owner: webshop-team, tags: [dev], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      finance_dev: { kind: catalog, label: finance_dev, owner: finance-team, tags: [dev], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      sales_dev: { kind: catalog, label: sales_dev, owner: sales-team, tags: [dev], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      customers_dev: { kind: catalog, label: customers_dev, owner: customers-team, tags: [dev], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      supply_dev: { kind: catalog, label: supply_dev, owner: supply-team, tags: [dev], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      orders_test: { kind: catalog, label: orders_test, owner: sp-lakehouse-test, tags: [test], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      webshop_test: { kind: catalog, label: webshop_test, owner: sp-lakehouse-test, tags: [test], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      finance_test: { kind: catalog, label: finance_test, owner: sp-lakehouse-test, tags: [test], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      sales_test: { kind: catalog, label: sales_test, owner: sp-lakehouse-test, tags: [test], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      customers_test: { kind: catalog, label: customers_test, owner: sp-lakehouse-test, tags: [test], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      supply_test: { kind: catalog, label: supply_test, owner: sp-lakehouse-test, tags: [test], elements: { bronze: { kind: schema, label: bronze }, silver: { kind: schema, label: silver }, gold: { kind: schema, label: gold } } }
      orders_prod:
        kind: catalog
        label: orders_prod
        owner: sp-lakehouse-prod
        tags: [prod]
        elements:
          bronze: { kind: schema, label: bronze }
          silver: { kind: schema, label: silver }
          gold: { kind: schema, label: gold, elements: { orders: { kind: table, label: orders } } }
      webshop_prod:
        kind: catalog
        label: webshop_prod
        owner: sp-lakehouse-prod
        tags: [prod]
        elements:
          bronze: { kind: schema, label: bronze }
          silver: { kind: schema, label: silver }
          gold: { kind: schema, label: gold, elements: { sessions: { kind: table, label: sessions } } }
      finance_prod:
        kind: catalog
        label: finance_prod
        owner: sp-lakehouse-prod
        tags: [prod]
        elements:
          bronze: { kind: schema, label: bronze }
          silver: { kind: schema, label: silver }
          gold: { kind: schema, label: gold, elements: { revenue: { kind: table, label: revenue } } }
      sales_prod:
        kind: catalog
        label: sales_prod
        owner: sp-lakehouse-prod
        tags: [prod]
        elements:
          bronze: { kind: schema, label: bronze }
          silver: { kind: schema, label: silver }
          gold: { kind: schema, label: gold, elements: { sell_through: { kind: table, label: sell_through } } }
      customers_prod:
        kind: catalog
        label: customers_prod
        owner: sp-lakehouse-prod
        tags: [prod]
        elements:
          bronze: { kind: schema, label: bronze }
          silver: { kind: schema, label: silver }
          gold: { kind: schema, label: gold, elements: { customers: { kind: table, label: customers, tags: [pii] } } }
      supply_prod:
        kind: catalog
        label: supply_prod
        owner: sp-lakehouse-prod
        tags: [prod]
        elements:
          bronze: { kind: schema, label: bronze, elements: { supplier_files: { kind: volume, label: supplier_files } } }
          silver: { kind: schema, label: silver }
          gold:
            kind: schema
            label: gold
            elements:
              stock_levels: { kind: table, label: stock_levels }
              demand_forecast: { kind: registered-model, label: demand_forecast }
      # Storage credentials: one per domain and environment, cred_<domain>_<env>. The Unity Catalog deployment guide
      # (docs/research/databricks-2026.md §5) advises separate storage accounts, storage credentials and access
      # connectors per environment and per domain. Each credential and each external location is ISOLATED and bound to
      # dbw-lakehouse-<env> only, as the catalogs are (governance.yaml). Access connectors stay per environment
      # (Northwind's choice): the six credentials of an environment all use dbac-lakehouse-<env>, so domains are kept
      # apart in Unity Catalog, not in Azure RBAC.
      # External locations: <domain>_<env>_catalog (the catalog's managed location) and <domain>_<env>_landing
      # (files the domain ingests), on the containers catalog and landing of st<domain><env>.
      cred_orders_dev: { kind: storage-credential, label: cred_orders_dev, tags: [dev] }
      cred_webshop_dev: { kind: storage-credential, label: cred_webshop_dev, tags: [dev] }
      cred_finance_dev: { kind: storage-credential, label: cred_finance_dev, tags: [dev] }
      cred_sales_dev: { kind: storage-credential, label: cred_sales_dev, tags: [dev] }
      cred_customers_dev: { kind: storage-credential, label: cred_customers_dev, tags: [dev] }
      cred_supply_dev: { kind: storage-credential, label: cred_supply_dev, tags: [dev] }
      cred_orders_test: { kind: storage-credential, label: cred_orders_test, tags: [test] }
      cred_webshop_test: { kind: storage-credential, label: cred_webshop_test, tags: [test] }
      cred_finance_test: { kind: storage-credential, label: cred_finance_test, tags: [test] }
      cred_sales_test: { kind: storage-credential, label: cred_sales_test, tags: [test] }
      cred_customers_test: { kind: storage-credential, label: cred_customers_test, tags: [test] }
      cred_supply_test: { kind: storage-credential, label: cred_supply_test, tags: [test] }
      cred_orders_prod: { kind: storage-credential, label: cred_orders_prod, tags: [prod] }
      cred_webshop_prod: { kind: storage-credential, label: cred_webshop_prod, tags: [prod] }
      cred_finance_prod: { kind: storage-credential, label: cred_finance_prod, tags: [prod] }
      cred_sales_prod: { kind: storage-credential, label: cred_sales_prod, tags: [prod] }
      cred_customers_prod: { kind: storage-credential, label: cred_customers_prod, tags: [prod] }
      cred_supply_prod: { kind: storage-credential, label: cred_supply_prod, tags: [prod] }
      orders_dev_catalog: { kind: external-location, label: orders_dev_catalog, technology: catalog@stordersdev, tags: [dev] }
      orders_dev_landing: { kind: external-location, label: orders_dev_landing, technology: landing@stordersdev, tags: [dev] }
      webshop_dev_catalog: { kind: external-location, label: webshop_dev_catalog, technology: catalog@stwebshopdev, tags: [dev] }
      webshop_dev_landing: { kind: external-location, label: webshop_dev_landing, technology: landing@stwebshopdev, tags: [dev] }
      finance_dev_catalog: { kind: external-location, label: finance_dev_catalog, technology: catalog@stfinancedev, tags: [dev] }
      finance_dev_landing: { kind: external-location, label: finance_dev_landing, technology: landing@stfinancedev, tags: [dev] }
      sales_dev_catalog: { kind: external-location, label: sales_dev_catalog, technology: catalog@stsalesdev, tags: [dev] }
      sales_dev_landing: { kind: external-location, label: sales_dev_landing, technology: landing@stsalesdev, tags: [dev] }
      customers_dev_catalog: { kind: external-location, label: customers_dev_catalog, technology: catalog@stcustomersdev, tags: [dev] }
      customers_dev_landing: { kind: external-location, label: customers_dev_landing, technology: landing@stcustomersdev, tags: [dev] }
      supply_dev_catalog: { kind: external-location, label: supply_dev_catalog, technology: catalog@stsupplydev, tags: [dev] }
      supply_dev_landing: { kind: external-location, label: supply_dev_landing, technology: landing@stsupplydev, tags: [dev] }
      orders_test_catalog: { kind: external-location, label: orders_test_catalog, technology: catalog@storderstest, tags: [test] }
      orders_test_landing: { kind: external-location, label: orders_test_landing, technology: landing@storderstest, tags: [test] }
      webshop_test_catalog: { kind: external-location, label: webshop_test_catalog, technology: catalog@stwebshoptest, tags: [test] }
      webshop_test_landing: { kind: external-location, label: webshop_test_landing, technology: landing@stwebshoptest, tags: [test] }
      finance_test_catalog: { kind: external-location, label: finance_test_catalog, technology: catalog@stfinancetest, tags: [test] }
      finance_test_landing: { kind: external-location, label: finance_test_landing, technology: landing@stfinancetest, tags: [test] }
      sales_test_catalog: { kind: external-location, label: sales_test_catalog, technology: catalog@stsalestest, tags: [test] }
      sales_test_landing: { kind: external-location, label: sales_test_landing, technology: landing@stsalestest, tags: [test] }
      customers_test_catalog: { kind: external-location, label: customers_test_catalog, technology: catalog@stcustomerstest, tags: [test] }
      customers_test_landing: { kind: external-location, label: customers_test_landing, technology: landing@stcustomerstest, tags: [test] }
      supply_test_catalog: { kind: external-location, label: supply_test_catalog, technology: catalog@stsupplytest, tags: [test] }
      supply_test_landing: { kind: external-location, label: supply_test_landing, technology: landing@stsupplytest, tags: [test] }
      orders_prod_catalog: { kind: external-location, label: orders_prod_catalog, technology: catalog@stordersprod, tags: [prod] }
      orders_prod_landing: { kind: external-location, label: orders_prod_landing, technology: landing@stordersprod, tags: [prod] }
      webshop_prod_catalog: { kind: external-location, label: webshop_prod_catalog, technology: catalog@stwebshopprod, tags: [prod] }
      webshop_prod_landing: { kind: external-location, label: webshop_prod_landing, technology: landing@stwebshopprod, tags: [prod] }
      finance_prod_catalog: { kind: external-location, label: finance_prod_catalog, technology: catalog@stfinanceprod, tags: [prod] }
      finance_prod_landing: { kind: external-location, label: finance_prod_landing, technology: landing@stfinanceprod, tags: [prod] }
      sales_prod_catalog: { kind: external-location, label: sales_prod_catalog, technology: catalog@stsalesprod, tags: [prod] }
      sales_prod_landing: { kind: external-location, label: sales_prod_landing, technology: landing@stsalesprod, tags: [prod] }
      customers_prod_catalog: { kind: external-location, label: customers_prod_catalog, technology: catalog@stcustomersprod, tags: [prod] }
      customers_prod_landing: { kind: external-location, label: customers_prod_landing, technology: landing@stcustomersprod, tags: [prod] }
      supply_prod_catalog: { kind: external-location, label: supply_prod_catalog, technology: catalog@stsupplyprod, tags: [prod] }
      supply_prod_landing: { kind: external-location, label: supply_prod_landing, technology: landing@stsupplyprod, tags: [prod] }
      contoso_sell_through: { kind: share, label: contoso_sell_through, technology: OpenSharing, owner: sales-team }
      contoso: { kind: recipient, label: contoso, technology: Databricks-to-Databricks }

  # Hub (Connectivity subscription, the network team's): as in examples/azure/hub-spoke.yaml
  sub-connectivity: { kind: subscription, label: sub-connectivity }
  vnet-hub-weu:
    kind: vnet
    label: vnet-hub-weu
    technology: 10.0.0.0/22
    elements:
      AzureFirewallSubnet: { kind: subnet, label: AzureFirewallSubnet, technology: 10.0.0.64/26 }
      snet-pep: { kind: subnet, label: snet-pep, technology: 10.0.1.0/26 }
      snet-webauth-host: { kind: subnet, label: snet-webauth-host, technology: 10.0.1.64/28 }
      snet-webauth-container: { kind: subnet, label: snet-webauth-container, technology: 10.0.1.80/28 }
  afw-hub: { kind: firewall, label: afw-hub, technology: Premium · 10.0.0.68 }
  dbw-webauth-weu: { kind: databricks, label: dbw-webauth-weu, technology: Private web auth · no workloads, description: Holds the region's browser_authentication endpoint; delete lock, owner: platform-team }
  pep-dbw-webauth-weu: { kind: private-endpoint, label: pep-dbw-webauth-weu, technology: browser_authentication }
  pep-dbw-lakehouse-dev-ui: { kind: private-endpoint, label: pep-dbw-lakehouse-dev-ui, technology: databricks_ui_api · front-end, tags: [dev] }
  pep-dbw-lakehouse-test-ui: { kind: private-endpoint, label: pep-dbw-lakehouse-test-ui, technology: databricks_ui_api · front-end, tags: [test] }
  pep-dbw-lakehouse-prod-ui: { kind: private-endpoint, label: pep-dbw-lakehouse-prod-ui, technology: databricks_ui_api · front-end, tags: [prod] }
  privatelink-azuredatabricks-net: { kind: dns, label: privatelink.azuredatabricks.net, technology: Private DNS zone }
  privatelink-dfs-core-windows-net: { kind: dns, label: privatelink.dfs.core.windows.net, technology: Private DNS zone }

  # Development
  sub-lakehouse-dev: { kind: subscription, label: sub-lakehouse-dev, tags: [dev] }
  rg-lakehouse-dev: { kind: resource-group, label: rg-lakehouse-dev, tags: [dev] }
  vnet-lakehouse-dev:
    kind: vnet
    label: vnet-lakehouse-dev
    technology: 10.1.8.0/22
    tags: [dev]
    elements:
      snet-dbw-host: { kind: subnet, label: snet-dbw-host, technology: 10.1.8.0/24 }
      snet-dbw-container: { kind: subnet, label: snet-dbw-container, technology: 10.1.9.0/24 }
      snet-pep: { kind: subnet, label: snet-pep, technology: 10.1.10.0/27 }
  nsg-dbw-lakehouse-dev: { kind: nsg, label: nsg-dbw-lakehouse-dev, technology: Rules managed by Databricks, tags: [dev] }
  rt-lakehouse-dev: { kind: route-table, label: rt-lakehouse-dev, technology: 0.0.0.0/0 → 10.0.0.68, tags: [dev] }
  dbw-lakehouse-dev: { kind: databricks, label: dbw-lakehouse-dev, technology: Premium · VNet-injected · no public access, owner: platform-team, tags: [dev] }
  # One access connector per environment; its managed identity has Storage Blob Data Contributor on the six dev domain accounts
  dbac-lakehouse-dev: { kind: access-connector, label: dbac-lakehouse-dev, technology: System-assigned identity, tags: [dev] }
  kv-lakehouse-dev: { kind: secrets, label: kv-lakehouse-dev, technology: Key Vault · secret scope, tags: [dev] }
  ncc-lakehouse-dev: { kind: ncc, label: ncc-lakehouse-dev, technology: Private endpoints to the dev accounts, tags: [dev] }
  pep-dbw-lakehouse-dev: { kind: private-endpoint, label: pep-dbw-lakehouse-dev, technology: databricks_ui_api · back-end, tags: [dev] }
  # A storage account per domain (containers: catalog, landing), each with a dfs private endpoint in snet-pep
  stordersdev: { kind: storage, label: stordersdev, technology: ADLS Gen2 · catalog · landing, owner: orders-team, tags: [dev] }
  stwebshopdev: { kind: storage, label: stwebshopdev, technology: ADLS Gen2 · catalog · landing, owner: webshop-team, tags: [dev] }
  stfinancedev: { kind: storage, label: stfinancedev, technology: ADLS Gen2 · catalog · landing, owner: finance-team, tags: [dev] }
  stsalesdev: { kind: storage, label: stsalesdev, technology: ADLS Gen2 · catalog · landing, owner: sales-team, tags: [dev] }
  stcustomersdev: { kind: storage, label: stcustomersdev, technology: ADLS Gen2 · catalog · landing, owner: customers-team, tags: [dev] }
  stsupplydev: { kind: storage, label: stsupplydev, technology: ADLS Gen2 · catalog · landing, owner: supply-team, tags: [dev] }
  pep-stordersdev-dfs: { kind: private-endpoint, label: pep-stordersdev-dfs, technology: dfs, tags: [dev] }
  pep-stwebshopdev-dfs: { kind: private-endpoint, label: pep-stwebshopdev-dfs, technology: dfs, tags: [dev] }
  pep-stfinancedev-dfs: { kind: private-endpoint, label: pep-stfinancedev-dfs, technology: dfs, tags: [dev] }
  pep-stsalesdev-dfs: { kind: private-endpoint, label: pep-stsalesdev-dfs, technology: dfs, tags: [dev] }
  pep-stcustomersdev-dfs: { kind: private-endpoint, label: pep-stcustomersdev-dfs, technology: dfs, tags: [dev] }
  pep-stsupplydev-dfs: { kind: private-endpoint, label: pep-stsupplydev-dfs, technology: dfs, tags: [dev] }

  # Test
  sub-lakehouse-test: { kind: subscription, label: sub-lakehouse-test, tags: [test] }
  rg-lakehouse-test: { kind: resource-group, label: rg-lakehouse-test, tags: [test] }
  vnet-lakehouse-test:
    kind: vnet
    label: vnet-lakehouse-test
    technology: 10.1.12.0/22
    tags: [test]
    elements:
      snet-dbw-host: { kind: subnet, label: snet-dbw-host, technology: 10.1.12.0/24 }
      snet-dbw-container: { kind: subnet, label: snet-dbw-container, technology: 10.1.13.0/24 }
      snet-pep: { kind: subnet, label: snet-pep, technology: 10.1.14.0/27 }
  nsg-dbw-lakehouse-test: { kind: nsg, label: nsg-dbw-lakehouse-test, technology: Rules managed by Databricks, tags: [test] }
  rt-lakehouse-test: { kind: route-table, label: rt-lakehouse-test, technology: 0.0.0.0/0 → 10.0.0.68, tags: [test] }
  dbw-lakehouse-test: { kind: databricks, label: dbw-lakehouse-test, technology: Premium · VNet-injected · no public access, owner: platform-team, tags: [test] }
  # One access connector per environment; its managed identity has Storage Blob Data Contributor on the six test domain accounts
  dbac-lakehouse-test: { kind: access-connector, label: dbac-lakehouse-test, technology: System-assigned identity, tags: [test] }
  kv-lakehouse-test: { kind: secrets, label: kv-lakehouse-test, technology: Key Vault · secret scope, tags: [test] }
  ncc-lakehouse-test: { kind: ncc, label: ncc-lakehouse-test, technology: Private endpoints to the test accounts, tags: [test] }
  pep-dbw-lakehouse-test: { kind: private-endpoint, label: pep-dbw-lakehouse-test, technology: databricks_ui_api · back-end, tags: [test] }
  # A storage account per domain (containers: catalog, landing), each with a dfs private endpoint in snet-pep
  storderstest: { kind: storage, label: storderstest, technology: ADLS Gen2 · catalog · landing, owner: orders-team, tags: [test] }
