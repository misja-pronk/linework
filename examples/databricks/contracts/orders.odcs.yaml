# Open Data Contract Standard v3.2.0 — https://bitol-io.github.io/open-data-contract-standard/
# host: the workspace URL of dbw-lakehouse-prod (adb-<workspace id>.<n>.azuredatabricks.net), reached over Private Link
# The Orders product's output port: orders_prod.gold.orders in Unity Catalog.
apiVersion: v3.2.0
kind: DataContract
id: northwind-orders
name: orders
version: 2.3.0
status: active
domain: Orders
dataProduct: Orders
description:
  purpose: One row per order from the ERP; an order is final once it is delivered.
servers:
  - server: prod
    type: databricks
    host: adb-2718281828459045.5.azuredatabricks.net
    catalog: orders_prod
    schema: gold
schema:
  - id: orders_tbl
    name: orders
    physicalType: table
    properties:
      - id: order_id_pk
        name: order_id
        logicalType: string
        physicalType: STRING
        primaryKey: true
        required: true
        quality:
          - metric: duplicateValues
            mustBe: 0
      - name: customer_id
        logicalType: string
        physicalType: STRING
        required: true
        relationships:
          - type: foreignKey
            to: customers.odcs.yaml#/schema/customers_tbl/properties/customer_id_pk
      - name: ordered_at
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
      - name: status
        logicalType: string
        physicalType: STRING
        required: true
      - name: total_eur
        logicalType: number
        physicalType: DECIMAL(12,2)
        required: true
        quality:
          - description: total_eur >= 0
      - name: delivered_at
        logicalType: timestamp
        physicalType: TIMESTAMP
slaProperties:
  - property: latency
    value: 15
    unit: min
  - property: availability
    value: 99.9%
  - property: retention
    value: 7
    unit: y
team:
  name: Order management team
