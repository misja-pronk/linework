# Who may do what in the Northwind lakehouse, in Unity Catalog: every domain through dev, test and prod.
#   principals   account groups, synced from Entra ID by automatic identity management (nested groups too);
#                a service principal per environment deploys the bundle and runs every job; the Customer 360 app
#                reads as its own service principal; Contoso is an OpenSharing recipient
#   resources    the uc-weu metastore, a workspace per environment, the <domain>_<env> catalogs and the
#                cred_<domain>_<env> storage credentials (each ISOLATED and bound to its environment's workspace only),
#                the gold schemas, the SFTP connection the supply pipeline reads through, and the share
#   roles        Unity Catalog privileges, each with on: the securables it can be granted on
#   ownership    a domain team owns its dev catalog; the environment's service principal owns the test and prod
#                catalogs: an owner has every privilege and can grant, so in test and prod only a reviewed, approved
#                release changes data or grants (environments.yaml). Teams read their own test and prod catalog
#   MANAGE       held by no one: whoever holds it can grant itself SELECT or MODIFY. The platform team is metastore
#                admin, which can take ownership of anything: a small group, its use audited
#   policies     an ABAC column mask on customers_prod masks every column with the governed tag pii,
#                except for customers-team, the prod jobs and the Customer 360 app
# The whole file is a working canvas (present: views); its views are the slides, one concern each.
# A name with <domain>, <env> or another list is written once per value of that list under each: (this file's own
# lists), so a domain or an environment is one more value there; an environment says what its team and its service
# principal are on its catalogs (team:, jobs:). tags put each environment on a layer.
# Ids are the model's (model.yaml) where the thing is the same; catalogs and credentials drop the uc-weu. prefix.
type: access
title: Unity Catalog access
subtitle: Northwind lakehouse · account groups from Entra ID, grants per domain and environment
include: [model.yaml]
present: views

each:
  domain: [orders, webshop, finance, sales, customers, supply]
  env:
    dev: { title: development, team: owner, jobs: pipeline, access: each team owns its dev catalog; the bundle's pipelines write there as sp-lakehouse-dev }
    test: { title: test, team: read-catalog, jobs: owner, access: sp-lakehouse-test owns the test catalogs; each team reads its own }
    prod: { title: production, team: read-catalog, jobs: owner, access: sp-lakehouse-prod owns the prod catalogs; each team reads its own; no one holds MANAGE }
  bi: [webshop, finance, sales]      # the domains whose gold analysts read in Power BI
  app: [customers, sales]            # the domains whose gold the Customer 360 app reads

layers:
  <env>: { tags: [<env>], title: <env> }

principals:
  # Account groups: made and filled in Entra ID, synced by automatic identity management
  platform-team: { kind: account-group, label: platform-team, caption: Metastore and workspace admins }
  engineers: { kind: account-group, label: engineers, caption: Every domain team }
  <domain>-team: { kind: account-group, label: <domain>-team, member-of: engineers }
  analysts: { kind: account-group, label: analysts, caption: Power BI and Genie }
  # Service principals: one per environment; GitHub Actions signs in as it with OIDC, and every job there runs as it
  sp-lakehouse-<env>: { kind: service-principal, label: sp-lakehouse-<env>, caption: Deploys and runs <env>, tags: [<env>] }
  # A Databricks App reads as its own service principal (app authorization), made with the app
  customer-360-app: { kind: service-principal, label: customer-360, caption: The app's own service principal, tags: [prod] }
  # OpenSharing recipient: Contoso's own Databricks account (Databricks-to-Databricks)
  contoso: { kind: recipient, label: contoso, caption: Databricks-to-Databricks · SecureConnect on, tags: [prod] }

resources:
  uc-weu: { kind: metastore, label: uc-weu, caption: Metastore }
  dbw-lakehouse-<env>: { kind: databricks, label: dbw-lakehouse-<env>, tags: [<env>] }
  # Catalogs: ISOLATED, each bound to its environment's workspace only (the caption says which); customers_prod holds
  # personal data
  <domain>_<env>: { kind: catalog, label: <domain>_<env>, bound: dbw-lakehouse-<env>, tags: [<env>] }
  <domain>_prod_gold: { kind: schema, label: <domain>_prod.gold, in: <domain>_prod, tags: [prod] }
  # Storage credentials: ISOLATED and bound like the catalogs (workspace binding), so no workspace can use another
  # environment's credential, https://learn.microsoft.com/azure/databricks/connect/unity-catalog/cloud-storage/manage-storage-credentials
  cred_<domain>_<env>: { kind: resource, label: cred_<domain>_<env>, caption: Storage credential · dbw-lakehouse-<env> only, bound: dbw-lakehouse-<env>, tags: [<env>] }
  # The Unity Catalog connection through which supply-pipeline's SFTP connector reads the suppliers' files
  sftp_suppliers: { kind: resource, label: sftp_suppliers, caption: Connection · SFTP, tags: [prod] }
  # OpenSharing share, under the metastore
  contoso_sell_through: { kind: share, label: contoso_sell_through, caption: sales_prod.gold.sell_through, tags: [prod] }

roles:
  # Privileges as Unity Catalog names them; on: says on which securables each can be granted, so linework validate
  # warns about a grant on the wrong level
  metastore-admin: { label: Metastore admin, tone: rose, permissions: [{ CREATE CATALOG: { on: metastore } }, { CREATE CONNECTION: { on: metastore } }, take ownership] }
  workspace-admin: { label: Workspace admin, tone: rose, permissions: [manage workspace] }
  workspace-user: { label: Workspace user, tone: slate, permissions: [sign in] }
  browse: { label: BROWSE, tone: slate, permissions: [{ BROWSE: { on: [catalog, external-location] } }] }   # names and comments, no rows
  use-catalog: { label: Use catalog, tone: teal, permissions: [{ USE CATALOG: { on: catalog } }] }
  read-schema: { label: Read schema, tone: teal, permissions: [{ USE SCHEMA: { on: [schema, catalog] } }, { SELECT: { on: [table, schema, catalog] } }] }
  # on a catalog: every schema, table, volume and model in it (a model is a function to Unity Catalog)
  read-catalog: { label: Read catalog, tone: teal, inherits: [use-catalog, read-schema], permissions: [{ READ VOLUME: { on: [volume, schema, catalog] } }, { EXECUTE: { on: [function, schema, catalog] } }] }
  # on a catalog: what a Lakeflow pipeline, a job and model training need to build the medallion layers
  pipeline:
    label: Pipeline
    tone: indigo
    inherits: read-catalog
    permissions:
      - MODIFY: { on: [table, schema, catalog] }
      - CREATE SCHEMA: { on: catalog }
      - CREATE TABLE: { on: [schema, catalog] }
      - CREATE MATERIALIZED VIEW: { on: [schema, catalog] }
      - CREATE MODEL: { on: [schema, catalog] }
  use-connection: { label: USE CONNECTION, tone: teal, permissions: [USE CONNECTION] }
  # Ownership is not a grant: the owner has every privilege and, like MANAGE, grants, transfers and drops
  owner: { label: Owner, tone: violet, permissions: [ALL PRIVILEGES, MANAGE] }
  share-read: { label: SELECT on share, tone: teal, permissions: [SELECT on share] }

policies:
  # ABAC: set on the catalog, it masks every column tagged pii for everyone but the CRM team, the prod jobs and the app
  mask-pii: { kind: column-mask, label: mask_pii, tag: pii, on: customers_prod, excludes: [customers-team, sp-lakehouse-prod, customer-360-app] }

assignments:
  # The platform team runs the metastore and the workspaces, owns the credentials and the connection; it holds no
  # grants on domain data
  - platform-team is metastore-admin on uc-weu
  - platform-team is workspace-admin on dbw-lakehouse-<env>
  - platform-team is owner on cred_<domain>_<env>
  - platform-team is owner on sftp_suppliers
  # Who may sign in where: engineers everywhere, analysts in prod, each service principal in its environment
  - engineers is workspace-user on dbw-lakehouse-<env>
  - analysts is workspace-user on dbw-lakehouse-prod
  - sp-lakehouse-<env> is workspace-user on dbw-lakehouse-<env>
  # Per environment, as each: env says: in dev each team owns its catalog and the bundle's pipelines run as
  # sp-lakehouse-dev; in test and prod the environment's service principal owns the catalogs and each team reads its own
  - <domain>-team is <env.team> on <domain>_<env>
  - sp-lakehouse-<env> is <env.jobs> on <domain>_<env>
  # supply-pipeline reads the suppliers' SFTP server through the connection (serverless: USE CONNECTION)
  - sp-lakehouse-prod is use-connection on sftp_suppliers
  # Every engineer may find production data: BROWSE shows names and comments, no rows
  - engineers is browse on <domain>_prod
  # Analysts: USE CATALOG on the catalogs they report on, and USE SCHEMA and SELECT on their gold schemas only
  - analysts is use-catalog on <bi>_prod
  - analysts is read-schema on <bi>_prod_gold
  # The Customer 360 app reads customers and sell-through from gold, unmasked
  - customer-360-app is use-catalog on <app>_prod
  - customer-360-app is read-schema on <app>_prod_gold
  # sell_through is shared with Contoso, who reads it in its own account; sales-team owns the share and the recipient
  - sales-team is owner on contoso_sell_through
  - contoso is share-read on contoso_sell_through

views:
  admins:
    title: Who administers
    subtitle: Northwind lakehouse · the platform team runs the metastore and workspaces; no data grants, yet it can take ownership
    include: [platform-team]
    exclude: [kind:resource]
  orders:
    title: One domain through its environments
    subtitle: Northwind lakehouse · orders-team owns dev and reads test and prod; there the service principal owns and writes
    include: [orders-team, engineers, sp-lakehouse-<env>, orders_<env>]
  production:
    title: Who reads production
    subtitle: Northwind lakehouse · analysts read the gold schemas they report on; Contoso reads its share
    include: [analysts, contoso]
    environment: prod
    exclude: [kind:databricks, mask-pii]
  pii:
    title: Personal data
    subtitle: Northwind lakehouse · mask_pii masks the columns tagged pii for all but customers-team, the prod jobs and the app
    include: [customers_prod.*]
    exclude: [engineers, sales_prod]
  sharing:
    title: Shared with Contoso
    subtitle: Northwind lakehouse · sales-team owns the share; Contoso reads sell_through in its own Databricks account
    include: [contoso_sell_through, sales_prod.*]
    exclude: [engineers, sp-lakehouse-prod, analysts, customer-360-app]
  storage:
    title: Credentials and connections
    subtitle: Northwind lakehouse · a credential per domain and environment, bound to its workspace alone (orders shown)
    include: [cred_orders_<env>, sftp_suppliers]
  <env>-access:
    title: Who × where in <env.title>
    subtitle: Northwind lakehouse · <env.access>
    show: access
    environment: <env>
    exclude: [uc-weu, kind:databricks, engineers, analysts, customer-360-app, kind:schema, kind:share, kind:resource]
  reading-roles:
    title: What the reading roles hold
    subtitle: Northwind lakehouse · BROWSE and USE CATALOG on a catalog, USE SCHEMA and SELECT on a schema or catalog
    show: roles
    include: [kind:account-group]
    exclude: [uc-weu, kind:databricks, kind:share, kind:resource]
  pipeline-role:
    title: What a pipeline needs
    subtitle: Northwind lakehouse · granted on each dev catalog to sp-lakehouse-dev; in test and prod the principal owns them
    show: roles
    include: [sp-lakehouse-dev]
    exclude: [kind:databricks, kind:resource]
