# Who may do what in the Northwind lakehouse, in Unity Catalog: all six domains through dev, test and prod.
#   principals   account groups, synced from Entra ID by automatic identity management (nested groups too);
#                a service principal per environment deploys the bundle and runs every job; Contoso is an OpenSharing recipient
#   resources    the uc-weu metastore, a workspace per environment, <domain>_<env> catalogs and the <domain>_<env>_landing
#                external locations (each ISOLATED and bound to its environment's workspace only; the cred_<domain>_<env>
#                storage credentials are bound the same way), the gold schemas analysts read, and the share
#   roles        Unity Catalog privileges, each role granted on one level: BROWSE and USE CATALOG on a catalog;
#                USE SCHEMA and SELECT on a schema (or on a catalog, for all its schemas); READ FILES on an external location
#   ownership    a domain team owns its dev catalog. sp-lakehouse-test and sp-lakehouse-prod own the test and prod
#                catalogs: an owner has every privilege implied and can grant, so in test and prod only a reviewed,
#                approved release changes data or grants (environments.yaml). Teams read their own test and prod catalog
#   MANAGE       held by no one: whoever holds it can grant itself SELECT or MODIFY. The platform team is metastore
#                admin, which can take ownership of anything: a small group, its use audited
#   policies     an ABAC column mask on customers_prod masks every column with the governed tag pii,
#                except for customers-team and sp-lakehouse-prod
# The whole file is a working canvas (present: views); its views are the slides, one concern each.
# tags put each environment on a layer (Layers menu, or carto render --layer prod).
# Ids are the model's (model.yaml) where the thing is the same; catalogs and locations drop the uc-weu. prefix.
type: access
title: Unity Catalog access
subtitle: Northwind lakehouse · account groups from Entra ID, grants per domain and environment
include: [model.yaml]
present: views

layers:
  dev: { tags: [dev], title: Development }
  test: { tags: [test], title: Test }
  prod: { tags: [prod], title: Production }

principals:
  # Account groups: made and filled in Entra ID, synced by automatic identity management
  platform-team: { kind: account-group, label: platform-team, caption: Metastore and workspace admins }
  engineers: { kind: account-group, label: engineers, caption: Every domain team }
  orders-team: { kind: account-group, label: orders-team, member-of: engineers }
  webshop-team: { kind: account-group, label: webshop-team, member-of: engineers }
  finance-team: { kind: account-group, label: finance-team, member-of: engineers }
  sales-team: { kind: account-group, label: sales-team, member-of: engineers }
  customers-team: { kind: account-group, label: customers-team, member-of: engineers }
  supply-team: { kind: account-group, label: supply-team, member-of: engineers }
  analysts: { kind: account-group, label: analysts, caption: Power BI and Genie }
  # Service principals: one per environment; GitHub Actions signs in as it with OIDC, and every job there runs as it
  sp-lakehouse-dev: { kind: service-principal, label: sp-lakehouse-dev, caption: Deploys and runs dev, tags: [dev] }
  sp-lakehouse-test: { kind: service-principal, label: sp-lakehouse-test, caption: Deploys and runs test, tags: [test] }
  sp-lakehouse-prod: { kind: service-principal, label: sp-lakehouse-prod, caption: Deploys and runs prod, tags: [prod] }
  # OpenSharing recipient: Contoso's own Databricks account (Databricks-to-Databricks)
  contoso: { kind: recipient, label: contoso, caption: Databricks-to-Databricks, tags: [prod] }

resources:
  uc-weu: { kind: metastore, label: uc-weu, caption: Metastore }
  dbw-lakehouse-dev: { kind: databricks, label: dbw-lakehouse-dev, tags: [dev] }
  dbw-lakehouse-test: { kind: databricks, label: dbw-lakehouse-test, tags: [test] }
  dbw-lakehouse-prod: { kind: databricks, label: dbw-lakehouse-prod, tags: [prod] }
  # Catalogs: ISOLATED, each bound to its environment's workspace only (the caption says which)
  orders_dev: { kind: catalog, label: orders_dev, bound: dbw-lakehouse-dev, tags: [dev] }
  webshop_dev: { kind: catalog, label: webshop_dev, bound: dbw-lakehouse-dev, tags: [dev] }
  finance_dev: { kind: catalog, label: finance_dev, bound: dbw-lakehouse-dev, tags: [dev] }
  sales_dev: { kind: catalog, label: sales_dev, bound: dbw-lakehouse-dev, tags: [dev] }
  customers_dev: { kind: catalog, label: customers_dev, bound: dbw-lakehouse-dev, tags: [dev] }
  supply_dev: { kind: catalog, label: supply_dev, bound: dbw-lakehouse-dev, tags: [dev] }
  orders_test: { kind: catalog, label: orders_test, bound: dbw-lakehouse-test, tags: [test] }
  webshop_test: { kind: catalog, label: webshop_test, bound: dbw-lakehouse-test, tags: [test] }
  finance_test: { kind: catalog, label: finance_test, bound: dbw-lakehouse-test, tags: [test] }
  sales_test: { kind: catalog, label: sales_test, bound: dbw-lakehouse-test, tags: [test] }
  customers_test: { kind: catalog, label: customers_test, bound: dbw-lakehouse-test, tags: [test] }
  supply_test: { kind: catalog, label: supply_test, bound: dbw-lakehouse-test, tags: [test] }
  orders_prod: { kind: catalog, label: orders_prod, bound: dbw-lakehouse-prod, tags: [prod] }
  webshop_prod: { kind: catalog, label: webshop_prod, bound: dbw-lakehouse-prod, tags: [prod] }
  finance_prod: { kind: catalog, label: finance_prod, bound: dbw-lakehouse-prod, tags: [prod] }
  sales_prod: { kind: catalog, label: sales_prod, bound: dbw-lakehouse-prod, tags: [prod] }
  customers_prod: { kind: catalog, label: customers_prod, bound: dbw-lakehouse-prod, tags: [prod, pii] }
  supply_prod: { kind: catalog, label: supply_prod, bound: dbw-lakehouse-prod, tags: [prod] }
  # The gold schemas analysts read
  orders_prod_gold: { kind: schema, label: orders_prod.gold, in: orders_prod, tags: [prod] }
  finance_prod_gold: { kind: schema, label: finance_prod.gold, in: finance_prod, tags: [prod] }
  sales_prod_gold: { kind: schema, label: sales_prod.gold, in: sales_prod, tags: [prod] }
  customers_prod_gold: { kind: schema, label: customers_prod.gold, in: customers_prod, tags: [prod, pii] }
  # Landing containers that Auto Loader reads: external locations, ISOLATED and bound like the catalogs
  orders_dev_landing: { kind: external-location, label: orders_dev_landing, bound: dbw-lakehouse-dev, tags: [dev] }
  webshop_dev_landing: { kind: external-location, label: webshop_dev_landing, bound: dbw-lakehouse-dev, tags: [dev] }
  finance_dev_landing: { kind: external-location, label: finance_dev_landing, bound: dbw-lakehouse-dev, tags: [dev] }
  sales_dev_landing: { kind: external-location, label: sales_dev_landing, bound: dbw-lakehouse-dev, tags: [dev] }
  customers_dev_landing: { kind: external-location, label: customers_dev_landing, bound: dbw-lakehouse-dev, tags: [dev] }
  supply_dev_landing: { kind: external-location, label: supply_dev_landing, bound: dbw-lakehouse-dev, tags: [dev] }
  orders_test_landing: { kind: external-location, label: orders_test_landing, bound: dbw-lakehouse-test, tags: [test] }
  webshop_test_landing: { kind: external-location, label: webshop_test_landing, bound: dbw-lakehouse-test, tags: [test] }
  finance_test_landing: { kind: external-location, label: finance_test_landing, bound: dbw-lakehouse-test, tags: [test] }
  sales_test_landing: { kind: external-location, label: sales_test_landing, bound: dbw-lakehouse-test, tags: [test] }
  customers_test_landing: { kind: external-location, label: customers_test_landing, bound: dbw-lakehouse-test, tags: [test] }
  supply_test_landing: { kind: external-location, label: supply_test_landing, bound: dbw-lakehouse-test, tags: [test] }
  orders_prod_landing: { kind: external-location, label: orders_prod_landing, bound: dbw-lakehouse-prod, tags: [prod] }
  webshop_prod_landing: { kind: external-location, label: webshop_prod_landing, bound: dbw-lakehouse-prod, tags: [prod] }
  finance_prod_landing: { kind: external-location, label: finance_prod_landing, bound: dbw-lakehouse-prod, tags: [prod] }
  sales_prod_landing: { kind: external-location, label: sales_prod_landing, bound: dbw-lakehouse-prod, tags: [prod] }
  customers_prod_landing: { kind: external-location, label: customers_prod_landing, bound: dbw-lakehouse-prod, tags: [prod] }
  supply_prod_landing: { kind: external-location, label: supply_prod_landing, bound: dbw-lakehouse-prod, tags: [prod] }
  # OpenSharing share, under the metastore
  contoso_sell_through: { kind: share, label: contoso_sell_through, caption: sales_prod.gold.sell_through, tags: [prod] }

roles:
  # Privileges as Unity Catalog names them; each role is granted on one level of securable (in its comment)
  metastore-admin: { label: Metastore admin, tone: rose, permissions: [CREATE CATALOG, CREATE EXTERNAL LOCATION, take ownership] }
  workspace-admin: { label: Workspace admin, tone: rose, permissions: [manage workspace] }
  workspace-user: { label: Workspace user, tone: slate, permissions: [sign in] }
  browse: { label: BROWSE, tone: slate, permissions: [BROWSE] }                      # on a catalog: names and comments, no rows
  use-catalog: { label: Use catalog, tone: teal, permissions: [USE CATALOG] }          # on a catalog
  read-schema: { label: Read schema, tone: teal, permissions: [USE SCHEMA, SELECT] }   # on a schema
  # on a catalog: every schema, table, volume and model in it
  read-catalog: { label: Read catalog, tone: teal, inherits: [use-catalog, read-schema], permissions: [READ VOLUME, EXECUTE] }
  # on a catalog: what a Lakeflow pipeline, a job and model training need to build the medallion layers
  pipeline: { label: Pipeline, tone: indigo, inherits: read-catalog, permissions: [MODIFY, CREATE SCHEMA, CREATE TABLE, CREATE MATERIALIZED VIEW, CREATE MODEL] }
  read-files: { label: READ FILES, tone: teal, permissions: [READ FILES] }             # on an external location
  # Ownership is not a grant: the owner has every privilege implied, and MANAGE (grant, transfer, drop) on what is in it
  owner: { label: Owner, tone: violet, permissions: [ALL PRIVILEGES, MANAGE] }
  share-read: { label: SELECT on share, tone: teal, permissions: [SELECT on share] }

policies:
  # ABAC: set on the catalog, it masks every column tagged pii for everyone but the CRM team and the prod jobs
  mask-pii: { kind: column-mask, label: mask_pii, tag: pii, on: customers_prod, excludes: [customers-team, sp-lakehouse-prod] }

assignments:
  # The platform team runs the metastore and the workspaces; it holds no grants on domain data
  - platform-team is metastore-admin on uc-weu
  - platform-team is workspace-admin on dbw-lakehouse-dev
  - platform-team is workspace-admin on dbw-lakehouse-test
  - platform-team is workspace-admin on dbw-lakehouse-prod
  # Who may sign in where: engineers everywhere, analysts in prod, each service principal in its environment
  - engineers is workspace-user on dbw-lakehouse-dev
  - engineers is workspace-user on dbw-lakehouse-test
  - engineers is workspace-user on dbw-lakehouse-prod
  - analysts is workspace-user on dbw-lakehouse-prod
  - sp-lakehouse-dev is workspace-user on dbw-lakehouse-dev
  - sp-lakehouse-test is workspace-user on dbw-lakehouse-test
  - sp-lakehouse-prod is workspace-user on dbw-lakehouse-prod
  # Dev: each team owns its catalog; the bundle's pipelines run as sp-lakehouse-dev
  - orders-team is owner on orders_dev
  - webshop-team is owner on webshop_dev
  - finance-team is owner on finance_dev
  - sales-team is owner on sales_dev
  - customers-team is owner on customers_dev
  - supply-team is owner on supply_dev
  - sp-lakehouse-dev is pipeline on orders_dev
  - sp-lakehouse-dev is pipeline on webshop_dev
  - sp-lakehouse-dev is pipeline on finance_dev
  - sp-lakehouse-dev is pipeline on sales_dev
  - sp-lakehouse-dev is pipeline on customers_dev
  - sp-lakehouse-dev is pipeline on supply_dev
  # Test and prod: the environment's service principal owns the catalogs; each team reads its own
  - sp-lakehouse-test is owner on orders_test
  - sp-lakehouse-test is owner on webshop_test
  - sp-lakehouse-test is owner on finance_test
  - sp-lakehouse-test is owner on sales_test
  - sp-lakehouse-test is owner on customers_test
  - sp-lakehouse-test is owner on supply_test
  - orders-team is read-catalog on orders_test
  - webshop-team is read-catalog on webshop_test
  - finance-team is read-catalog on finance_test
  - sales-team is read-catalog on sales_test
  - customers-team is read-catalog on customers_test
  - supply-team is read-catalog on supply_test
  - sp-lakehouse-prod is owner on orders_prod
  - sp-lakehouse-prod is owner on webshop_prod
  - sp-lakehouse-prod is owner on finance_prod
  - sp-lakehouse-prod is owner on sales_prod
  - sp-lakehouse-prod is owner on customers_prod
  - sp-lakehouse-prod is owner on supply_prod
  - orders-team is read-catalog on orders_prod
  - webshop-team is read-catalog on webshop_prod
  - finance-team is read-catalog on finance_prod
  - sales-team is read-catalog on sales_prod
  - customers-team is read-catalog on customers_prod
  - supply-team is read-catalog on supply_prod
  # Auto Loader reads the landing containers as the environment's service principal; nobody else reads files there
  - sp-lakehouse-dev is read-files on orders_dev_landing
  - sp-lakehouse-dev is read-files on webshop_dev_landing
  - sp-lakehouse-dev is read-files on finance_dev_landing
  - sp-lakehouse-dev is read-files on sales_dev_landing
  - sp-lakehouse-dev is read-files on customers_dev_landing
  - sp-lakehouse-dev is read-files on supply_dev_landing
  - sp-lakehouse-test is read-files on orders_test_landing
  - sp-lakehouse-test is read-files on webshop_test_landing
  - sp-lakehouse-test is read-files on finance_test_landing
  - sp-lakehouse-test is read-files on sales_test_landing
  - sp-lakehouse-test is read-files on customers_test_landing
  - sp-lakehouse-test is read-files on supply_test_landing
  - sp-lakehouse-prod is read-files on orders_prod_landing
  - sp-lakehouse-prod is read-files on webshop_prod_landing
  - sp-lakehouse-prod is read-files on finance_prod_landing
  - sp-lakehouse-prod is read-files on sales_prod_landing
  - sp-lakehouse-prod is read-files on customers_prod_landing
  - sp-lakehouse-prod is read-files on supply_prod_landing
  # Every engineer may find production data: BROWSE shows names and comments, no rows
  - engineers is browse on orders_prod
  - engineers is browse on webshop_prod
  - engineers is browse on finance_prod
  - engineers is browse on sales_prod
  - engineers is browse on customers_prod
  - engineers is browse on supply_prod
  # Analysts: USE CATALOG on four prod catalogs, and USE SCHEMA and SELECT on their gold schemas only
  - analysts is use-catalog on orders_prod
  - analysts is use-catalog on finance_prod
  - analysts is use-catalog on sales_prod
  - analysts is use-catalog on customers_prod
  - analysts is read-schema on orders_prod_gold
  - analysts is read-schema on finance_prod_gold
  - analysts is read-schema on sales_prod_gold
  - analysts is read-schema on customers_prod_gold
  # sell_through is shared with Contoso, who reads it in its own account; sales-team owns the share and the recipient
  - sales-team is owner on contoso_sell_through
  - contoso is share-read on contoso_sell_through

views:
  admins:
    title: Who administers
    subtitle: Northwind lakehouse · the platform team runs the metastore and workspaces; no data grants, yet it can take ownership
    include: [platform-team]
  orders:
    title: One domain through its environments
    subtitle: Northwind lakehouse · orders-team owns dev and reads test and prod; there the service principal owns and writes
    include: [orders-team, engineers, kind:service-principal, orders_dev, orders_test, orders_prod]
  production:
    title: Who reads production
    subtitle: Northwind lakehouse · analysts read four gold schemas, pii masked; Contoso reads its share
    include: [analysts, contoso]
    environment: prod
    exclude: [kind:databricks, mask-pii]
  pii:
    title: Personal data
    subtitle: Northwind lakehouse · mask_pii masks the columns tagged pii for all but customers-team and the prod jobs
    include: [customers_prod.*]
    exclude: [engineers]
  sharing:
    title: Shared with Contoso
    subtitle: Northwind lakehouse · sales-team owns the share; Contoso reads sell_through in its own Databricks account
    include: [contoso_sell_through, sales_prod.*]
    exclude: [engineers, sp-lakehouse-prod, analysts]
  landing:
    title: Landing files in production
    subtitle: Northwind lakehouse · only sp-lakehouse-prod reads the landing containers, and only from dbw-lakehouse-prod
    include: [kind:external-location]
    environment: prod
  prod-access:
    title: Who × where in production
    subtitle: Northwind lakehouse · each team reads its own catalog, sp-lakehouse-prod owns all six; no one holds MANAGE
    show: access
    environment: prod
    exclude: [uc-weu, kind:databricks, engineers, analysts, kind:schema, contoso_sell_through, kind:external-location]
  dev-access:
    title: Who × where in development
    subtitle: Northwind lakehouse · each team owns its dev catalog; the bundle's pipelines write there as sp-lakehouse-dev
    show: access
    environment: dev
    exclude: [uc-weu, kind:databricks, platform-team, engineers, kind:external-location]
  test-access:
    title: Who × where in test
    subtitle: Northwind lakehouse · sp-lakehouse-test owns the test catalogs; each team reads its own
    show: access
    environment: test
    exclude: [uc-weu, kind:databricks, platform-team, engineers, kind:external-location]
  reading-roles:
    title: What the reading roles hold
    subtitle: Northwind lakehouse · BROWSE and USE CATALOG on a catalog, USE SCHEMA and SELECT on a schema or catalog
    show: roles
    include: [kind:account-group]
    exclude: [uc-weu, kind:databricks, kind:share]
  pipeline-role:
    title: What a pipeline needs
    subtitle: Northwind lakehouse · granted on each dev catalog to sp-lakehouse-dev; in test and prod the principal owns them
    show: roles
    include: [sp-lakehouse-dev]
    exclude: [kind:databricks, kind:external-location]
