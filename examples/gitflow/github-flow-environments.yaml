type: gitflow
title: GitHub flow with environments
subtitle: "Northwind Orders API · squash-merged pull requests; every merge goes through dev and test to an approval gate before production"

# The branches behind process/pull-request.yaml and process/release-to-production.yaml:
# one long-lived branch (main), everything else lives for a pull request and is deleted on merge.
# Branches need no declaring: each gets its own lane, and a prefix such as feature/, fix/ or dependabot/
# makes it a short-lived branch (they share one colour). Every pull request is squash-merged.

# A track under the branches: where each commit was deployed.
environments: [dev, test, production]

# The history, oldest first. A branch starts on its first commit, from main.
steps:
  - commit: main
    tag: v1.3.0
    deploy: production

  # Two pull requests at the same time, each on its own branch.
  - commit: feature/order-export
    label: Export endpoint
  - commit: fix/vat-rounding
    label: Round VAT per line
  - commit: feature/order-export
    label: Fix lint
    note: Checks red, then green
  - merge: fix/vat-rounding -> main
    deploy: [dev, test]
  - commit: feature/order-export
    label: Review fixes
    note: Changes requested
  - merge: feature/order-export -> main
    note: Review approved
    deploy: [dev, test]
  - commit: dependabot/nuget/Azure.Identity-1.14.0
    label: Bump Azure.Identity
  - merge: dependabot/nuget/Azure.Identity-1.14.0 -> main
    deploy: [dev, test]

  # Production: every merge's run waits at the production environment's gate after test. An approver
  # lets this one through; the tag only labels what went to production, it does not start a deploy.
  - note: Approval gate
    on: main
  - deploy: production
    on: main
  - tag: v1.4.0
    on: main
