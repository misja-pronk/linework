type: network
title: Hybrid connectivity
subtitle: Northwind · ExpressRoute to the Azure hub, a site-to-site VPN over the internet as failover

# Top: the data centre and, beside it, the ExpressRoute circuit (both on the edge tier); below: the Azure hub and its spokes.
# The circuit is 1 Gbps private peering at Equinix AM with two links; BFD on both, so a failed link is noticed within a second.
# Both paths run BGP. Azure prefers ExpressRoute over the VPN for the same prefix; the DC router prefers it by local
# preference and prepends its AS on the VPN (which only steers Azure's choice). The VPN gateway runs active-active.
# Spokes use the hub's gateways (gateway transit), but their route tables (rt-erp-prod, rt-intranet-prod) have
# gateway route propagation off and send 0.0.0.0/0 to the firewall.
# Address plan: data centre 10.10.0.0/16, hub 10.0.0.0/22, spokes 10.1.0.0/16 (a /22 each).

groups:
  expressroute-circuit: { kind: wan, label: ExpressRoute circuit, caption: 1 Gbps · Equinix AM }
  amsterdam-dc: { kind: datacenter, label: Amsterdam DC, cidr: 10.10.0.0/16 }
  servers: { kind: vlan, label: Servers, in: amsterdam-dc, vlan: 100, cidr: 10.10.100.0/24 }

  west-europe: { kind: region, label: Azure West Europe }
  vnet-hub-weu: { kind: vnet, label: vnet-hub-weu, in: west-europe, cidr: 10.0.0.0/22 }
  GatewaySubnet: { kind: subnet, label: GatewaySubnet, in: vnet-hub-weu, cidr: 10.0.0.0/27 }
  AzureFirewallSubnet: { kind: subnet, label: AzureFirewallSubnet, in: vnet-hub-weu, cidr: 10.0.0.64/26 }
  vnet-erp-prod: { kind: vnet, label: vnet-erp-prod, in: west-europe, cidr: 10.1.0.0/22 }
  vnet-intranet-prod: { kind: vnet, label: vnet-intranet-prod, in: west-europe, cidr: 10.1.4.0/22 }

nodes:
  rtr-ams: { kind: router, in: amsterdam-dc, model: BGP AS 65010 · BFD, ha: true, tier: edge, tags: [expressroute, vpn] }
  dc01: { kind: dns, in: servers, model: AD DS + DNS, ip: 10.10.100.10, tier: edge, tags: [expressroute, vpn] }

  msee: { kind: router, label: MSEE, in: expressroute-circuit, model: Microsoft edge · AS 12076, ha: true, tier: edge, tags: [expressroute] }

  ergw-hub: { kind: cloud-gateway, label: ergw-hub, in: GatewaySubnet, model: ErGw1AZ, tags: [expressroute] }
  vpng-hub: { kind: vpn-gateway, label: vpng-hub, in: GatewaySubnet, model: VpnGw2AZ · AS 65515, tags: [vpn] }
  afw-hub: { kind: firewall, icon: shield, label: afw-hub, in: AzureFirewallSubnet, model: Azure Firewall Premium, ip: 10.0.0.68, tier: access, tags: [expressroute, vpn] }

  vmss-erp-prod: { kind: server, icon: server-cog, label: vmss-erp-prod, in: vnet-erp-prod, model: VM scale set, tier: access, tags: [expressroute, vpn] }
  vmss-intranet-prod: { kind: server, icon: server-cog, label: vmss-intranet-prod, in: vnet-intranet-prod, model: VM scale set, tier: access, tags: [expressroute, vpn] }

# Plain lines are Ethernet in the data centre and routing inside the hub VNet.
key:
  solid: Link

edges:
  - dc01 -- rtr-ams: { speed: 10G, count: 2 }
  # Primary: ExpressRoute, two links to the Microsoft edge (primary and secondary)
  - rtr-ams -- msee: { style: circuit, label: eBGP ×2 }
  - msee -- ergw-hub: { style: circuit, label: private peering }
  # Failover: IPsec over the internet, BGP with AS-path prepending
  - rtr-ams -- vpng-hub: { style: vpn, label: IPsec · BGP }
  # Inside Azure: the gateways hand everything to the firewall, which forwards over the peerings
  - ergw-hub -- afw-hub
  - vpng-hub -- afw-hub
  - afw-hub -- vmss-erp-prod: { style: peering }
  - afw-hub -- vmss-intranet-prod: { style: peering }

layers:
  expressroute:
    tags: [expressroute]
    title: ExpressRoute
    caption: The normal path. Private, 1 Gbps, BGP over two links to the Microsoft edge.
  vpn:
    tags: [vpn]
    title: VPN failover
    caption: Only used when ExpressRoute is down. Azure prefers ExpressRoute for the same prefix; the DC router prefers it by local preference.

steps:
  - title: Two ways in
    caption: Two ways from the data centre into the Azure hub, both through the hub firewall.
  - title: Normal operation
    caption: Traffic takes ExpressRoute. Azure prefers it over the VPN for the same prefix; so does the DC router.
    path: dc01 -> rtr-ams -> msee -> ergw-hub -> afw-hub -> vmss-erp-prod
  - title: Circuit down
    caption: BFD notices within a second and BGP withdraws the ExpressRoute routes. The VPN takes over.
    path: rtr-ams -> vpng-hub -> afw-hub
    note: { msee: Down }
  - title: Spokes stay put
    caption: Spoke route tables (gateway routes off) send 0.0.0.0/0 to the firewall, so a failover does not touch them.
    focus: [afw-hub, vmss-erp-prod, vmss-intranet-prod]
