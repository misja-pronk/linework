type: mindmap
title: What could the data platform offer?
subtitle: Capability brainstorm, two levels shown
depth: 2

center: Data platform
topics:
  Ingest:
    - Batch loads: [Files from SFTP, Database snapshots]
    - Streaming: [Change data capture, Event topics]
    - SaaS connectors
  Store:
