type: systems
title: Web shop threat model
subtitle: STRIDE review of checkout, release 4.2

groups:
  internet: { kind: trust-boundary, label: Internet }
  edge: { kind: zone, label: Edge (DMZ), trust: true }
  app: { kind: zone, label: Application zone, trust: true }
  data: { kind: zone, label: Data zone, in: app, trust: true }
  psp: { kind: trust-boundary, label: Payment provider }

nodes:
  shopper: { kind: users, label: Shopper, in: internet }
  admin: { kind: user, label: Shop admin, in: internet }
  cdn: { kind: cdn, label: CDN + WAF, in: edge }
  web: { kind: client, label: Storefront, in: edge }
  api: { kind: gateway, label: API gateway, in: app }
  orders: { kind: service, label: Orders service, in: app }
  backoffice: { kind: service, label: Back office, in: app }
  db: { kind: database, label: Orders DB, in: data, encrypted: true }
  sessions: { kind: cache, label: Session cache, in: data }
  stripe:
    kind: payments
    label: Stripe
    in: psp
    threats: [] # reviewed: the provider's own PCI DSS scope

edges:
  - shopper -> cdn: { label: HTTPS, auth: session cookie }
  - cdn -> web: { label: HTTPS, auth: true }
  - web -> api:
      label: REST over TLS
      auth: OAuth2
      threats:
        - { id: T1, stride: S, title: Stolen access token replayed from another device, mitigation: Short-lived tokens bound to the client (DPoP), status: open }
        - { id: T2, stride: D, title: Checkout flooded by bots, mitigation: Rate limits per client at the gateway, status: mitigated }
  - admin -> backoffice:
      label: HTTPS
      threats:
        - { id: T3, stride: [S, E], title: Admin login phished, mitigation: SSO with phishing-resistant MFA (FIDO2), status: open }
  - api -> orders: { label: gRPC, encrypted: true, auth: mTLS }
  - orders -> db:
      label: SQL over TLS
      auth: true
      threats:
        - { id: T4, stride: T, title: SQL injection through order notes, mitigation: Parameterised queries only, status: mitigated }
  - orders -> sessions: { label: RESP }
  - orders -> stripe:
      label: HTTPS
      auth: API key
      threats:
        - { id: T5, stride: R, title: Customer disputes a charge nobody can trace, mitigation: Signed audit log of every charge request, status: accepted }
  - backoffice -> db: { label: SQL over TLS, auth: true }

threats:
  - { on: orders, id: T6, stride: E, title: Order ids guessed to read other orders (IDOR), mitigation: Check ownership on every read, status: open }
  - { on: db, id: T7, stride: I, title: Backups copied out of the data zone, mitigation: "Encrypted backups, keys in KMS", status: transferred }
