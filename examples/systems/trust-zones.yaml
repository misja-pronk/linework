type: systems
title: Web shop trust zones
subtitle: Checkout across five trust boundaries
# Top-down, the zones sit beside each other and the text stays near 7 pt on a slide; left to right
# the zones run in one long row and it comes out under 6 pt.
direction: down

groups:
  internet: { kind: trust-boundary, label: Internet }
  edge: { kind: zone, label: Edge (DMZ), trust: true }
  app: { kind: zone, label: Application zone, trust: true }
  data: { kind: zone, label: Data zone, in: app, trust: true }
  # The payment provider, named by its name: a shorter header keeps the drawing slide-wide.
  psp: { kind: trust-boundary, label: Stripe }

nodes:
  shopper: { kind: users, label: Shopper, in: internet }
  admin: { kind: user, label: Shop admin, in: internet }
  cdn: { kind: cdn, label: CDN + WAF, in: edge }
  web: { kind: client, label: Storefront, in: edge }
  # Admins cross the DMZ too: an access proxy that signs them in (SSO with MFA) before the back office.
  proxy: { kind: gateway, label: Access proxy, caption: SSO · MFA, in: edge }
  api: { kind: gateway, label: API gateway, in: app }
  orders: { kind: service, label: Orders service, in: app }
  backoffice: { kind: service, label: Back office, in: app }
  db: { kind: database, label: Orders DB, in: data }
  sessions: { kind: cache, label: Session cache, in: data }
  stripe: { kind: payments, label: Card payments, in: psp }

edges:
  - shopper -> cdn: HTTPS
  - cdn -> web: HTTPS
  - web -> api: REST over TLS
  - admin -> proxy: HTTPS
  - proxy -> backoffice: HTTPS
  - api -> orders: gRPC
  - orders -> db: SQL over TLS
  - orders -> sessions: RESP
  - orders -> stripe: HTTPS
  - backoffice -> db: SQL over TLS
