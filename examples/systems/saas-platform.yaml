type: systems
title: Booking platform
subtitle: Multi-tenant SaaS on Kubernetes
direction: down

groups:
  cloud: { kind: cloud, label: AWS eu-west-1 }
  edge: { kind: zone, label: Public edge, in: cloud }
  k8s: { kind: cluster, label: EKS cluster, in: cloud }
  core: { kind: team, label: Core team, in: k8s }
  growth: { kind: team, label: Growth team, in: k8s }
  data: { kind: zone, label: Data tier, in: cloud }

nodes:
  guests: { kind: users, label: Guests, tags: [phase-1] }
  app: { kind: mobile, label: Guest app, tags: [phase-1] }
  admin: { kind: client, label: Host dashboard, tags: [phase-2] }
  cdn: { kind: cdn, label: CloudFront, in: edge, tags: [phase-1] }
  lb: { kind: load-balancer, label: ALB, in: edge, tags: [phase-1] }
  bookings: { kind: service, label: Bookings, in: core, tags: [phase-1] }
  search: { kind: search, label: Availability search, in: core, tags: [phase-2] }
  billing: { kind: service, label: Billing, in: growth, tags: [phase-2] }
  notify: { kind: worker, label: Notifier, in: growth, tags: [phase-2] }
  pg: { kind: database, label: Postgres, caption: RDS, in: data, tags: [phase-1, data] }
  redis: { kind: cache, label: Sessions, caption: ElastiCache, in: data, tags: [phase-1, data] }
  events: { kind: topic, label: booking-events, caption: Kafka, in: data, tags: [phase-2, data] }
  auth: { kind: identity, label: Auth0, tags: [phase-1] }
  stripe: { kind: payments, label: Stripe, tags: [phase-2] }
  mail: { kind: email, label: SendGrid, tags: [phase-2] }

edges:
  - guests -> app
  - app -> cdn: { label: HTTPS, style: sync }
  - admin -> cdn: { label: HTTPS, style: sync }
  - cdn -> lb: { style: sync }
  - lb -> bookings: { style: sync }
  - lb -> search: { style: sync }
  - bookings -> pg: { style: data }
  - bookings -> redis: { style: data }
  - bookings -> events: { label: BookingConfirmed, style: async }
  - events -> billing: { style: async }
  - events -> notify: { style: async }
  - billing -> stripe: { label: charge, style: sync }
  - notify -> mail: { style: sync }
  - app -> auth: { label: OIDC, style: dotted }

# The plan in layers: what launches first on its own, then phase 2 on top of it with the rest faded.
layers:
  launch:
    tags: [phase-1]
    title: Phase 1
    caption: Guests book through the app; one service, one database.
  phase-2:
    tags: [phase-2]
    title: Phase 2
    dim-others: true
    caption: Search, billing and notifications join, around an event stream.
  data:
    tags: [data]
    title: Data stores
