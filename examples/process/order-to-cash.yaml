type: process
title: Order to cash
subtitle: A customer order from the moment it arrives until the money is booked

lanes:
  sales: Sales
  warehouse: Warehouse
  finance: Finance

nodes:
  Order received: { kind: message, in: sales }
  Check credit: { in: finance, kind: service }
  Confirm order: { in: sales, kind: user }
  Ask for prepayment: sales
  Pick, pack and ship: { in: warehouse, kind: manual }
  Send invoice: { in: finance, kind: service }
  Invoice: document
  Payment term: { kind: timer, label: 30 days }
  Send reminder: { in: finance, kind: service }
  Book payment: finance
  Order paid: { kind: end, in: finance }

# Picking, packing and shipping are one warehouse step and the process ends once the payment is booked,
# so the whole order fits on one slide.
flow:
  - Order received -> Check credit -> Credit ok? -yes-> Confirm order -> Pick, pack and ship -> Send invoice -> Payment term -> Paid? -yes-> Book payment -> Order paid
  - Credit ok? -no-> Ask for prepayment -> Confirm order
  - Paid? -no-> Send reminder -> Payment term
  - Send invoice -> Invoice
