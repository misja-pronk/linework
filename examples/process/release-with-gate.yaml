type: process
title: Release to production
subtitle: Every merge is built and staged by the pipeline; a person decides what reaches customers

lanes:
  dev: Developer
  ci: Pipeline
  release: Release manager

nodes:
  Merge to main: { in: dev, kind: user }
  Build and test: { in: ci, kind: script }
  Fix the build: dev
  Deploy to staging: { in: ci, kind: service }
  Smoke tests: { in: ci, kind: script }
  Review release: { in: release, kind: manual, caption: change notes and test report }
  Deploy to production: { in: ci, kind: service }
  Roll back: { in: ci, kind: service }
  Released: { kind: end, in: ci }
  Release held: end
  Release failed: { kind: error, in: ci }

flow:
  - start -> Merge to main -> Build and test -> Tests green? -yes-> Deploy to staging -> Smoke tests -> Review release -> Approved? -yes-> Deploy to production -> Healthy? -yes-> Released
  - Tests green? -no-> Fix the build -> Merge to main
  - Approved? -no-> Release held
  - Healthy? -no-> Roll back -> Release failed
