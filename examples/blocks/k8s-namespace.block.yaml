# The standard namespace of one web service on Kubernetes (docs/blocks.md).
type: kubernetes
title: K8s namespace with ingress, service, deployment and HPA
description: A namespace with an ingress and its TLS secret, a service in front of a deployment, a horizontal pod autoscaler and the deployment's config map
tags: [kubernetes, namespace, web]
params:
  name: { default: web, label: App name }
  host: { default: web.example.com, label: Host name }

groups:
  ${name}-ns: { kind: namespace, label: "${name}" }

nodes:
  ${name}-ingress: { kind: ingress, label: "${name}", in: "${name}-ns", host: "${host}" }
  ${name}-tls: { kind: secret, label: "${name}-tls", in: "${name}-ns" }
  ${name}-svc: { kind: service, label: "${name}", in: "${name}-ns", ports: [80] }
  ${name}-deploy: { kind: deployment, label: "${name}", in: "${name}-ns", replicas: 2 }
  ${name}-hpa: { kind: hpa, label: "${name}", in: "${name}-ns", replicas: 2-10 }
  ${name}-config: { kind: configmap, label: "${name}-config", in: "${name}-ns" }

edges:
  - ${name}-ingress -> ${name}-tls
  - ${name}-ingress -> ${name}-svc: /
  - ${name}-svc -> ${name}-deploy
  - ${name}-hpa -> ${name}-deploy
  - ${name}-deploy -> ${name}-config
