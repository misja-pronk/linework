site_name: Cartography in MkDocs
site_description: Diagrams kept as YAML next to the docs
theme:
  name: mkdocs
  # Follow the reader's colour scheme, with a switch in the bar; the diagrams follow along.
  color_mode: auto
  user_color_mode_toggle: true
# The diagrams are source for the hook, not pages or downloads.
exclude_docs: |
  diagrams/
hooks:
  - hooks/cartography.py
# Both are written into the site by the hook when the build ends.
extra_css:
  - carto/carto.css
extra_javascript:
  - path: carto/carto-diagram.js
    type: module
