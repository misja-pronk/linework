type: journey
title: First deploy on the internal developer platform
subtitle: A product team takes a new service to production on the paved road

persona:
  name: Ravi Menon
  role: Tech lead of a product team
  avatar: beard
  tone: teal
  goal: A new service in production this sprint, without a ticket queue
  quote: If the paved road is slower than my own script, I will take the script.

phases:
  discover: Discover
  create: Create
  ship: Ship
  run: Run

metrics:
  Time to first deploy: 2 days
  Tickets raised: 1
  Teams on the platform: 14 of 40

steps:
  hear:
    label: Sees the platform in a guild demo
    in: discover
    feel: 3 curious
    touchpoint: Guild meeting
    with: Platform team
    thought: Looks good in a demo. Will it fit our service?
    frontstage: Demo of the golden path
    backstage: Platform team prepares a sample service
    support: Slide deck and recording

  docs:
    label: Reads the getting-started guide
    in: discover
    feel: 4 hopeful
    touchpoint:
      - { label: Developer portal, link: ../systems/saas-platform.yaml }
      - Docs
    says: One page, and it starts with a working example.
    gains: Guide is short and tested every night
    frontstage: Getting-started guide
    backstage: Docs are built from the templates
    support: Developer portal

  scaffold:
    label: Creates the service from a template
    in: create
    feel: 5 impressed
    touchpoint: [Developer portal, GitHub]
    says: Repository, pipeline and dashboard in five minutes.
    gains:
      - Template comes with pipeline and alerts
      - No ticket needed
    metrics: 5 min
    frontstage: Template form in the portal
    backstage: Scaffolder creates repository and pipeline
    support: [GitHub, Template catalogue]

  secrets:
    label: Connects the database and secrets
    in: create
    feel: 2 stuck
    touchpoint: [Terminal, Slack]
    with: Platform support
    thought: Which of the three vaults is ours?
    pains:
      - Secret names differ per environment
      - Database needs a ticket
    ideas: Database as a self-service resource
    metrics: 1 ticket, 1 day
    frontstage: Support channel answers
    backstage: Engineer creates the database by hand
    support: [Key vault, Ticket system]

  preview:
    label: Opens a pull request and gets a preview
    in: ship
    feel: 4 confident
    touchpoint:
      - { label: Delivery pipeline, link: ../gitflow/trunk-delivery.yaml }
      - { label: Preview environment, link: ../kubernetes/platform.yaml }
    says: The reviewer can click through the change.
    gains: Preview environment per pull request
    frontstage: Preview link on the pull request
    backstage: Pipeline builds, scans and deploys
    support: [Kubernetes cluster, Image registry]

  production:
    label: Promotes the release to production
    in: ship
    feel: 3 careful
    touchpoint: Deploy dashboard
    with: Product owner
    thought: Who approves this, and how long does that take?
    pains: Approval rule is unclear for new services
    ideas: Automatic approval when checks are green
    metrics: 2 hours waiting
    frontstage: Approval request
    backstage: Change record is filed automatically
    support: [Policy engine, Change register]

  observe:
    label: Watches the standard dashboard
    in: run
    feel: 5 in control
    touchpoint: [Grafana, Alerts]
    says: Dashboards and alerts were there before I asked.
    gains: Golden signals out of the box
    frontstage: Service dashboard
    backstage: Telemetry is collected by default
    support: [Monitoring stack, On-call rota]

  cost:
    label: Looks up what the service costs
    in: run
    feel: 3 puzzled
    touchpoint: Cost report
    thought: The report is per cluster, not per team.
    pains: Cost is not shown per service
    ideas: Cost per service in the portal
    frontstage: Monthly cost report
    backstage: Finance allocates by cluster
    support: Billing export
