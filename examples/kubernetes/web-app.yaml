type: kubernetes
title: Web shop
subtitle: One namespace, from ingress to Postgres

# Sized for a slide: postgres is reached through its Service (postgres:5432), left out here, and
# the images are web 2.3.0, api and order-worker 1.4.2 (ghcr.io/acme/...), postgres 16.4, redis 7.4.

groups:
  prod: { kind: cluster, label: prod-eu-1 }
  shop: { kind: namespace, in: prod }

nodes:
  customers: { kind: users, label: Customers }
  stripe: { kind: external, label: Stripe }
  ingress: { kind: ingress, label: shop, in: shop, host: shop.acme.io }
  web-svc: { kind: service, label: web, in: shop, ports: [80] }
  web: { kind: deployment, in: shop, replicas: 2 }
  api-svc: { kind: service, label: api, in: shop, ports: ["80:8080"] }
  api: { kind: deployment, in: shop }
  api-hpa: { kind: hpa, in: shop, replicas: 3-12 }
  worker: { kind: deployment, label: order-worker, in: shop, replicas: 2 }
  nightly: { kind: cronjob, label: invoice-run, in: shop, schedule: "0 3 * * *" }
  postgres: { kind: statefulset, in: shop }
  redis: { kind: statefulset, in: shop }
  pg-data: { kind: pvc, label: data, in: shop, size: 50Gi }
  redis-data: { kind: pvc, label: data, in: shop, size: 5Gi }
  api-config: { kind: configmap, in: shop }
  db-credentials: { kind: secret, in: shop }
  shop-tls: { kind: secret, in: shop }
  api-sa: { kind: serviceaccount, label: shop-api, in: shop }

edges:
  - customers -> ingress: HTTPS
  - ingress -> shop-tls
  - ingress -> web-svc: /
  - ingress -> api-svc: /api
  - web-svc -> web
  - api-svc -> api
  - api -> postgres: SQL
  - api -> redis
  - api -> stripe: payments
  - api -> api-config
  - api -> db-credentials
  - api -> api-sa
  - api-hpa -> api
  - worker -> postgres
  - worker -> db-credentials
  - nightly -> postgres
  - nightly -> db-credentials
  - postgres -> pg-data
  - postgres -> db-credentials
  - redis -> redis-data
