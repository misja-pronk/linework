type: cloud
provider: aws
title: Web shop on AWS
subtitle: Production, three availability zones
direction: down

groups:
  # The region is in the account's header (eu-west-1): one box less around the VPC.
  account: { kind: account, label: shop-prod, account: "123456789012", region: eu-west-1 }
  vpc: { kind: vpc, label: vpc-shop, cidr: 10.0.0.0/16, in: account }
  az-a: { kind: zone, zone: eu-west-1a, in: vpc }
  az-b: { kind: zone, zone: eu-west-1b, in: vpc }
  az-c: { kind: zone, zone: eu-west-1c, in: vpc }
  app-a: { kind: subnet, tier: private, cidr: 10.0.10.0/24, in: az-a }
  app-b: { kind: subnet, tier: private, cidr: 10.0.11.0/24, in: az-b }
  app-c: { kind: subnet, tier: private, cidr: 10.0.12.0/24, in: az-c }
  data-a: { kind: subnet, tier: isolated, cidr: 10.0.20.0/24, in: az-a }
  data-b: { kind: subnet, tier: isolated, cidr: 10.0.21.0/24, in: az-b }
  data-c: { kind: subnet, tier: isolated, cidr: 10.0.22.0/24, in: az-c }

nodes:
  users: users
  cdn: { kind: cloudfront, label: CDN and WAF }
  # The public tier: the internet gateway and one load balancer across the zones, both on the public row.
  # AWS puts a node of the load balancer in a public subnet of each zone (10.0.0.0/24, 10.0.1.0/24,
  # 10.0.2.0/24); its caption says so. Drawn as boxes, with a NAT gateway in each for the tasks' way
  # out, they took the slide under 5 pt, so the public subnets and NAT gateways are named, not drawn.
  igw: { kind: internet-gateway, label: Internet gateway, in: vpc, tier: public }
  alb: { kind: alb, label: Load balancer, in: vpc, tier: public, exposure: public, caption: ALB · a public subnet per zone }
  web-a: { kind: ecs, label: Web shop, in: app-a, size: 2 tasks }
  web-b: { kind: ecs, label: Web shop, in: app-b, size: 2 tasks }
  web-c: { kind: ecs, label: Web shop, in: app-c, size: 2 tasks }
  # One Aurora cluster: a writer and two reader instances on the cluster's shared storage, which Aurora
  # itself keeps in every zone. No lines between them: the instances do not copy data to each other.
  db-a: { kind: aurora, label: Orders reader, in: data-a, caption: Aurora instance · same cluster }
  db-b: { kind: aurora, label: Orders writer, in: data-b, caption: Aurora instance · cluster orders }
  db-c: { kind: aurora, label: Orders reader, in: data-c, caption: Aurora instance · same cluster }

edges:
  # Unlabelled to fit a slide; the key says what each style is. Users reach the CDN over HTTPS,
  # and the web shop talks SQL to the cluster's writer.
  - users -> cdn: { style: public }
  - cdn -> igw: { style: public }
  - igw -> alb: { style: public }
  - alb -> web-a: { style: private }
  - alb -> web-b: { style: private }
  - alb -> web-c: { style: private }
  - web-a -> db-b: { style: private }
  - web-b -> db-b: { style: private }
  - web-c -> db-b: { style: private }
