# The organization at a glance: its OUs, the accounts in them and what each account runs. The shared
# network (egress, Direct Connect, the VPCs attached to the transit gateway) is drawn in depth in
# aws-landing-zone-network.yaml; the network and workload accounts link there.
type: cloud
provider: aws
title: AWS landing zone
subtitle: Organization and accounts
direction: down

groups:
  org: { kind: organization, label: Acme }
  security: { kind: ou, label: Security, in: org }
  infra: { kind: ou, label: Infrastructure, in: org }
  workloads: { kind: ou, label: Workloads, in: org }

  management: { kind: account, label: Management, account: "111111111111", in: org }
  log-archive: { kind: account, label: Log archive, account: "222222222222", in: security }
  audit: { kind: account, label: Audit, account: "333333333333", in: security }
  network: { kind: account, label: Network, account: "444444444444", in: infra, links: [aws-landing-zone-network.yaml] }
  shop-prod: { kind: account, label: shop-prod, account: "555555555555", in: workloads, links: [aws-landing-zone-network.yaml] }
  shop-dev: { kind: account, label: shop-dev, account: "666666666666", in: workloads, links: [aws-landing-zone-network.yaml] }

nodes:
  tower: { kind: control-tower, label: Guardrails, in: management }
  sso: { kind: identity-center, label: Single sign-on, in: management }

  trail: { kind: cloudtrail, label: Organization trail, in: log-archive }
  logs: { kind: s3, label: Log bucket, in: log-archive }
  findings: { kind: security-hub, label: Findings, in: audit }
  threats: { kind: guardduty, label: Threat detection, in: audit }

  tgw: { kind: transit-gateway, label: Transit gateway, in: network, links: [aws-landing-zone-network.yaml] }

  prod-app: { kind: eks, label: Web shop, in: shop-prod }
  dev-app: { kind: eks, label: Web shop (dev), in: shop-dev }

edges:
  - trail -> logs: { style: data }
  - threats -> findings: { style: data }
