type: cloud
provider: gcp
title: Data platform on Google Cloud
subtitle: BigQuery at the centre, one project per stage

# The three projects sit in one folder (data) in the organization; left out of the drawing so it
# fits a slide.
groups:
  sources: { kind: boundary, label: Sources }
  ingest: { kind: project, label: Ingest, project: acme-data-ingest }
  warehouse: { kind: project, label: Warehouse, project: acme-data-warehouse }
  serve: { kind: project, label: Serve, project: acme-data-serve }

nodes:
  saas: { kind: external, label: SaaS apps, caption: CRM and billing, in: sources }
  orders: { kind: cloud-sql, label: Orders database, in: sources }
  clicks: { kind: client, label: Web and app events, in: sources }

  landing: { kind: gcs, label: Landing bucket, in: ingest }
  cdc: { kind: datastream, label: Change data capture, in: ingest }
  events: { kind: pubsub, label: Events, in: ingest }
  streaming: { kind: dataflow, label: Streaming pipeline, in: ingest }
  schedule: { kind: composer, label: Load and orchestrate, in: ingest }

  raw: { kind: bigquery, label: Raw datasets, in: warehouse }
  transform: { kind: dataform, label: Transformations, in: warehouse }
  marts: { kind: bigquery, label: Data marts, in: warehouse }
  governance: { kind: dataplex, label: Catalog and quality, in: warehouse }

  # Analysts read the dashboards.
  looker: { kind: looker, label: Dashboards, in: serve }
  models: { kind: vertex-ai, label: Forecast models, in: serve }

# The lines say what they are by their style (see the key), so the drawing stays slide-sized:
# SaaS apps drop daily files in the landing bucket, Datastream captures changes (CDC) from the
# orders database, and Composer loads the bucket into BigQuery and runs the Dataform transformations,
# whose lineage Dataplex catalogues.
edges:
  - saas -> landing: { style: data }
  - orders -> cdc: { style: data }
  - clicks -> events: { style: data }
  - events -> streaming: { style: data }
  - landing -> raw: { style: data }
  - cdc -> raw: { style: data }
  - streaming -> raw: { style: data }
  - schedule -> raw: { style: management }
  - schedule -> transform: { style: management }
  - raw -> marts: { style: data }
  - transform -> marts: { style: management }
  - transform -- governance
  - marts -> looker: { style: data }
  - marts -> models: { style: data }
