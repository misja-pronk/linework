# Azure RBAC across the scope hierarchy, with Privileged Identity Management (PIM).
#   resources    the scopes, nested with `in:`: management group → subscription → resource group → resource.
#                A role assigned on a scope is inherited by everything inside it.
#   assignments  "who is role on scope" is active (standing) access;
#                "who is eligible role on scope" is PIM: held only after activation, drawn dashed.
#                The long form adds PIM's settings: activation (the longest one activation lasts) and approval (who approves).
# Switch the view (graph, access, roles) to see the same file as a who × where matrix
# (effective access, with where it is inherited from) or as roles × permissions.
type: access
title: Azure access
subtitle: Northwind shop · Azure roles from management group to resource, standing and eligible through PIM
view: graph   # graph, access or roles

principals:
  # People are in groups; groups hold the roles.
  priya: { kind: user, label: Priya Shah, caption: Developer, member-of: sg-shop-developers }
  daan: { kind: user, label: Daan Visser, caption: Platform engineer, member-of: sg-azure-platform-admins }
  sg-azure-platform-admins: { kind: group }
  sg-azure-readers: { kind: group, caption: Security group · security and finance }
  sg-shop-developers: { kind: group }
  sg-shop-operations: { kind: group }

resources:
  # The scope tree. Add a subscription or resource group by giving it an `in:`.
  mg-northwind: { kind: management-group, label: Northwind }
  mg-landing-zones: { kind: management-group, label: Landing zones, in: mg-northwind }
  sub-shop-dev: { kind: subscription, label: sub-shop-dev, in: mg-landing-zones }
  sub-shop-prod: { kind: subscription, label: sub-shop-prod, in: mg-landing-zones }
  rg-shop-prod: { kind: resource-group, label: rg-shop-prod, in: sub-shop-prod }
  kv-shop-prod: { kind: key-vault, label: kv-shop-prod, in: rg-shop-prod }

roles:
  # Built-in roles, one custom role and a data-plane role. permissions feed the roles view.
  reader: { label: Reader, permissions: [read] }
  contributor: { label: Contributor, inherits: reader, permissions: [create, change and delete] }
  owner: { label: Owner, inherits: contributor, permissions: [assign roles] }
  app-operator: { label: Shop App Operator (custom), inherits: reader, permissions: [restart apps] }
  kv-secrets-officer: { label: Key Vault Secrets Officer, permissions: [manage secrets] }

assignments:
  # Broad and read-only at the top; anything that changes production is eligible, not standing.
  - sg-azure-readers is reader on mg-northwind
  - { principal: sg-azure-platform-admins, role: owner, scope: mg-northwind, eligible: true, activation: 4 h, approval: sg-azure-platform-admins }
  - sg-shop-developers is contributor on sub-shop-dev
  - sg-shop-developers is reader on sub-shop-prod
  - { principal: sg-shop-developers, role: contributor, scope: rg-shop-prod, eligible: true, activation: 8 h }
  - sg-shop-operations is app-operator on rg-shop-prod
  - sg-shop-operations is eligible kv-secrets-officer on kv-shop-prod

# For presenting: one point per step.
steps:
  - title: Scopes
    caption: Management group, subscription, resource group, resource. A role assigned on a scope is inherited by everything below it.
    focus: [mg-northwind]
  - title: Standing access
    caption: Read-only at the top for security and finance. Developers can change dev and read production.
    path: [sg-azure-readers -> mg-northwind, sg-shop-developers -> sub-shop-dev, sg-shop-developers -> sub-shop-prod]
  - title: Production through PIM
    caption: Developers are eligible for Contributor on rg-shop-prod. They activate it for up to 8 hours, with MFA and a reason, and it ends by itself.
    path: [priya -> sg-shop-developers -> rg-shop-prod]
    note: { sg-shop-developers -> rg-shop-prod: "MFA and a reason" }
  - title: Operations, least privilege
    caption: Operations gets a custom role that can restart the apps and nothing more, and can activate secret management on the vault when needed.
    path: [sg-shop-operations -> rg-shop-prod, sg-shop-operations -> kv-shop-prod]
  - title: No standing Owner
    caption: Platform admins are eligible for Owner on the management group. Activation needs another admin's approval, and every activation is in the audit log.
    path: [daan -> sg-azure-platform-admins -> mg-northwind]
    note: { sg-azure-platform-admins: "A second admin approves" }
